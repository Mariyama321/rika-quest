    fb.innerHTML = `<div class="fb ok"><h3>せいかい！</h3>${q.e?`<p>${esc(q.e)}</p>`:""}${qm}${bonus}</div>
      <div class="acts mvs">${mvh}</div><div class="acts ${(bag().superflask||0)>0&&!B.trainer&&!(B.qd&&B.qd.mode==="boss")?'':'one'}">
      ${B.trainer?`<button class="btn alt" id="ball" disabled>フラスコ<small>トレーナーのモンスターはつかまえられない</small></button>`:B.qd&&B.qd.mode==="boss"?`<button class="btn alt" id="ball" disabled>フラスコ<small>マスターでなかまになる</small></button>`:`<button class="btn alt" id="ball" ${save.balls?'':'disabled'}>フラスコ<small>${save.balls?'のこり '+save.balls+'こ':'もっていない'}</small></button>`}</div>`;
    if((bag().superflask||0)>0 && !B.trainer && !(B.qd&&B.qd.mode==="boss")){ const ac=app.querySelector(".acts:not(.mvs)"); if(ac){ ac.insertAdjacentHTML("beforeend",`<button class="btn" id="sball">スーパーフラスコ<small>のこり ${bag().superflask}こ・とてもつかまえやすい</small></button>`); document.getElementById("sball").onclick=()=>doBall(true); } }
    app.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>doAttack(b.dataset.mv));
    document.getElementById("ball").onclick=()=>doBall(false);
    setLog(`<b>${esc(nameOf(B.lead))}</b>がやる気になった！ どのわざをつかう？`);
  }else{
    B.combo=0; B.mistakes++;
    let hurt="", down=false;
    const hasty = fast && !B.tower;
    if(useHP()){ const r=hurtLead(hasty?2:1); down=hpOf(B.lead)<=0;
      hurt=(hasty?'<span class="hasty">あわてんぼう！</span> ':'')+`やせいの <b>${esc(nameOf(B.wild.id,B.wild.lv))}</b>のこうげき！ ${r.mm===2?'こうかはばつぐんだ！ ':r.mm===.5?'こうかはいまひとつ。 ':''}${r.guarded?'まもりでダメージが半分！ ':''}${rollText(r.roll)}<b>${esc(nameOf(B.lead))}</b>に ${r.d}ダメージ！`+(down?` <b>${esc(nameOf(B.lead))}</b>はたおれてしまった…`:'');
      B.lastHurt=r.d; }
    else { B.hearts--; hurt=`やせいの <b>${esc(nameOf(B.wild.id,B.wild.lv))}</b>のこうげき！ ハートが1つへった。`; }
    const lost = useHP() ? !aliveIds().length : B.hearts<=0;
    item.missed=true;
    if(!B.qd){ save.wrong[item.key]=(save.wrong[item.key]||0)+1; (save.wrongEver=save.wrongEver||{})[item.key]=1; }
    item.hidden=[]; item.seq=[]; item.pairs={}; item.selL=null; item.selP=null; item.input=""; item.readUntil=null;
    if(B.tower){ B.queue.shift(); B.queue.push(towerNext()); } else B.queue.push(B.queue.shift());
    persist();
    const wm=document.getElementById("wildMon"), mm=document.getElementById("meMon");
    wm.classList.add("lunge2"); setTimeout(()=>{ mm.classList.add("hit");
      if(useHP()){ const t=document.createElement("div"); t.className="dmg me"; t.textContent=B.lastHurt; const fd=document.getElementById("field"); if(fd) fd.appendChild(t); updMyHP(); if(down) setTimeout(()=>mm.classList.add("faint"),350);
        const pt=app.querySelector(".ptm"); if(pt) pt.outerHTML=hpMiniHTML(); } },200);
    if(!useHP()){ const hs=app.querySelectorAll(".hearts svg path"); if(hs[B.hearts]) hs[B.hearts].setAttribute("fill","#dfe6ee"); }
    setLog(hurt);
    fb.innerHTML = `<div class="fb ng">${ansText.length>18?`<h3>ざんねん…</h3><p><b>正解：${esc(ansText)}</b></p>`:`<h3>ざんねん… 正解は「${esc(ansText)}」</h3>`}${q.e?`<p>${esc(q.e)}</p>`:""}${qm}${hasty&&useHP()?'<p class="mini hasty">すぐに答えてまちがえたので、ダメージが2倍になった！ 問題をよく読んでから答えよう。</p>':''}<p class="mini">解説を読んでから「わかった！」をおそう。</p><p class="mini">${B.tower?'ハートが0になると塔からおりるよ。':lost?'なかまが全員たおれてしまった…':down?'つぎのなかまにこうたいするよ。この問題は、あとでもう一度出てくるよ。':'この問題は、あとでもう一度出てくるよ。'}</p></div><button class="btn" id="next" style="margin-top:12px" disabled>${lost?'わかった！ …':down?'わかった！ つぎのなかまを出す':'わかった！'}</button>`;
    document.getElementById("next").onclick=()=>{ B.busy=false; if(lost) return finish(false);
      if(useHP() && hpOf(B.lead)<=0){ B.lead=aliveIds()[0]; B.swapOpen=false; const m2=bestMult(B.lead,B.wild.id); logMsg=`いけっ！ <b>${esc(nameOf(B.lead))}</b>！`+(m2===2?' あいしょうはばつぐん！':m2===.5?' あいしょうが悪いかも…':''); }
      renderBattle(); };
    { const nb=document.getElementById("next"), lab=nb.textContent; let k=Math.min(5, Math.max(2, 1+Math.ceil((q.e||"").length*.04)));
      nb.textContent=`${lab}（${k}）`;
      const iv=setInterval(()=>{ k--; if(k<=0 || !document.body.contains(nb)){ clearInterval(iv); nb.disabled=false; nb.textContent=lab; } else nb.textContent=`${lab}（${k}）`; },1000); }
  }
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function newMovesHTML(){ const a=B.newMoves||[]; return a.length?`<p class="line">${a.map(([id,k])=>`<b>${esc(nameOf(id))}</b>は「${esc(MOVES[k].n)}」をおぼえた！`).join("<br>")}</p>`:''; }
function bagCount(){ const bb=bag(); return (bb.kizu||0)+(bb.mitsu||0); }
function bagHTML(){ const bb=bag(), canK=useHP()&&hpOf(B.lead)<maxHPOf(B.lead), canM=B.sid!=="boss"&&!B.trainer&&!B.mitsu;
  return `<div class="bag">${(bb.kizu||0)>0?`<button data-bag="kizu" ${canK?'':'disabled'}>${itemSVG("kizu")}<span>きずぐすり ×${bb.kizu}<br><small>${canK?'HPを半分回復':useHP()?'HPはまんたん':'ここでは使えない'}</small></span></button>`:''}${(bb.mitsu||0)>0?`<button data-bag="mitsu" ${canM?'':'disabled'}>${itemSVG("mitsu")}<span>あまいミツ ×${bb.mitsu}<br><small>${canM?'まだいないモンスターを呼ぶ':'ここでは使えない'}</small></span></button>`:''}</div>`; }
function lockActs(){ app.querySelectorAll(".acts button").forEach(b=>b.disabled=true); document.getElementById("field").scrollIntoView({behavior:"smooth",block:"start"}); }
function doAttack(k){
  if(typeof k!=="string") k=movesOf(B.lead)[0];
  lockActs();
  const M=MOVES[k], {m}=dmgOf(k), rl=dmgRoll(), d=Math.max(1, Math.round(dmgOf(k).d*rl.k)), weekUp = M.eff==="week" && SP[B.lead].day===new Date().getDay(); B.power=false;
  const w=B.wild, wm=document.getElementById("wildMon"), mm=document.getElementById("meMon");
  mm.classList.add("lunge");
  setTimeout(()=>{
    wm.classList.add("hit");
    const t=document.createElement("div"); t.className="dmg"+(m===2||rl.t==="crit"?" big":""); t.textContent=d; document.getElementById("field").appendChild(t);
    w.hp=Math.max(0,w.hp-d); const r=w.hp/w.max, bar=document.getElementById("whp");
    bar.className="bar hpbar "+hpClass(r); bar.firstElementChild.style.width=(r*100)+"%";
    let msg=`<b>${esc(nameOf(B.lead))}</b>の <b>${esc(M.n)}</b>！ `+(weekUp?'曜日のパワーで2倍！ ':'')+rollText(rl.t)+(m===2?'こうかはばつぐんだ！':m===.5?'こうかはいまひとつ…':'')+` ${d}ダメージ！`;
    if(M.eff==="heal" && useHP()){ const g=healLead(.25); if(g){ msg+=` HPが${g}回復した！`; updMyHP(); } }
    if(M.eff==="guard"){ B.guard=true; msg+=' 次にうけるダメージが半分になる！'; }
    if(M.eff==="catch" && w.hp>0){ B.lure=true; msg+=' フラスコが入りやすくなった！'; }
    if(w.hp<=0){ msg+=` <b>${esc(nameOf(w.id,w.lv))}</b>をたおした！`; B.defeated++; { const k2=w.shiny?2:w.strong?1.5:1; addExp(B.lead,xp(12)*k2); save.party.forEach(id=>{ if(id!==B.lead) addExp(id,xp(6)*k2); }); } setTimeout(()=>wm.classList.add("faint"),350); }
    else if(r<=.3) msg+=` よわっている！ フラスコのチャンス！`;
    setLog(msg);
    setTimeout(after, w.hp<=0?1300:1000);
  },250);
}
function doBall(sup){
  lockActs();
  const w=B.wild, boss=B.sid==="boss";
  if(sup===true) bag().superflask=Math.max(0,(bag().superflask||0)-1); else save.balls--; persist();
  const p = Math.min(.97, (boss?.08:.3) + (1-w.hp/w.max)*(boss?.55:.55) + Math.min(B.combo,5)*.04 + (B.luck?.3:0) + (B.lure?.2:0) + (sup===true?(boss?.3:.35):0));
  B.luck=false; B.lure=false;
  const got = Math.random()<p, shakes = got?3:Math.floor(Math.random()*3);
  const f=document.getElementById("field"), fl=document.createElement("div");
  fl.className="flask fly"; fl.innerHTML=flaskSVG; f.appendChild(fl);
  const wm=document.getElementById("wildMon");
  setLog(`いけっ、フラスコ！`);
  setTimeout(()=>{ wm.classList.add("suck"); fl.className="flask rest"; let k=0;
    const step=()=>{
      if(k<shakes){ k++; fl.className="flask rest"; void fl.offsetWidth; fl.className="flask wob"; setLog("…".repeat(k)); setTimeout(step,700); return; }
      if(got){
        const nm=nameOf(w.id,w.lv), had=!!save.owned[w.id];
        if(had){ /* もういるモンスター（v37）: つかまえた子のLvが高ければそのLvに、色ちがいならそのまま色ちがいに（下がることはない） */
          const o=save.owned[w.id], up=w.lv>o.lv, sh=!!w.shiny && !o.shinyWild;
          if(up){ o.lv=w.lv; o.exp=0; const fw=formIdx(w.id,w.lv); if(fw>(o.form??0)) o.form=fw; }
          if(sh) Object.assign(o,{shiny:true,shinyWild:true});
          if(up||sh){ persist(); setLog(`やった！ ${w.shiny?'色ちがいの ':''}<b>${esc(nm)}</b>をつかまえた！ なかまの${esc(nameOf(w.id))}が${up?`Lv.${w.lv}`:''}${up&&sh?'の':''}${sh?'色ちがい':''}になった！`); }
          else { addExp(w.id,25); setLog(`やった！ <b>${esc(nm)}</b>をつかまえた！ もうなかまにいるので、なかまの${esc(nameOf(w.id))}がパワーアップ（EXP+25）！`); } }
        else{ save.owned[w.id]={lv:w.lv,exp:0,form:formIdx(w.id,w.lv),sz:w.sz||1}; if(w.shiny) Object.assign(save.owned[w.id],{shiny:true,shinyWild:true}); misAdd("catch"); if(save.party.length<3) save.party.push(w.id); persist(); setLog(`やった！ <b>${esc(nm)}</b>をつかまえた！ なかまになった！`); }
        B.caught.push({id:w.id, lv:w.lv, dup:had, shiny:!!w.shiny});
        w.hp=0; w.caught=true; setTimeout(after,1500);
      }else{
        fl.remove(); wm.classList.remove("suck");
        setLog(`ああっ！ <b>${esc(nameOf(w.id,w.lv))}</b>が出てきてしまった！`+(w.hp/w.max>.3?' もっとよわらせよう。':''));
        setTimeout(after,1300);
      }
    };
    setTimeout(step,300);
  },620);
}
function after(){
  B.busy=false;
  const gone = B.wild.hp<=0;
  if(B.trainer){ if(!B.queue.length) B.queue=trainerQs();
    if(gone){ B.trainer.idx++; if(B.trainer.idx>=B.trainer.team.length) return finish(true); spawn(); renderBattle(true); } else renderBattle(); return; }
  if(!B.queue.length) return finish(true);
  if(gone){ spawn(); renderBattle(true); } else renderBattle();
}

/* ---------- result ---------- */
function finish(win){
  if(B.qd) return finishQD(win);
  if(B.trainer) return finishTrainer(win);
  stat().maxCombo=Math.max(stat().maxCombo||0,B.maxCombo); B.extraBalls=0; misMax("combo",B.maxCombo); if(win && B.sid!=="review") misAdd("route");
  window.scrollTo(0,0);
  let stars=0;
  if(win){
    stars = B.mistakes===0?3:B.mistakes<=2?2:1;
    save.balls += 3;
    if(B.sid!=="review"){ const k=B.u.id+"|"+B.sid, prev=save.cleared[k]||0; if(!prev) B.extraBalls+=2; if(stars===3 && prev<3) B.extraBalls+=3; save.cleared[k]=Math.max(prev,stars); }
    save.balls += B.extraBalls;
    addExp(B.lead, stars*5);
  }
  persist();
  const rares = grantRares(), megas = grantMegas(), urs = grantUR(), umegas = grantUMegas();
  const lvAfter = prefLevels(), newCol = Object.keys(lvAfter).filter(p=>lvAfter[p]>(B.colBefore[p]||0));
  const gets = [
    ...umegas.map(umegaCard),
    rewardCards(),
    ...urs.map(urCard),
    ...(B.fracUp?[`<div class="card get"><div class="mon">${art("ur_frac",1,{sil:true})}</div><div><b>分数カードに★が ${B.fracUp}こ ついた！</b><span>分数カード ${fracDone()} / ${FRAC_UNIT().cards.length} が★3</span></div></div>`]:[]),
    ...megas.map(megaCard),
    ...rares.map(rareCard),
    ...(newCol.length?[`<div class="card get evo"><div class="mon" style="width:64px;height:64px">${mapSVG({view:newCol, fill:Object.fromEntries(newCol.map(p=>[p,MAPLV[lvAfter[p]]]))})}</div><div><b>地図の ${newCol.map(p=>MAPD[p][0]).join("・")} の色がこくなった！</b><span>色の段階 ${[...new Set(newCol.map(p=>lvAfter[p]))].join("・")}／4　「ちず」で見てみよう</span></div></div>`]:[]),
    ...B.evoReady.map(id=>`<div class="card get evo"><div class="mon">${artMine(id)}</div><div><b>${esc(nameOf(id))} Lv.${save.owned[id].lv}</b><span>しんかできるようになった！ 「なかま」でしんかさせよう</span></div></div>`),
    ...B.caught.map(c=>`<div class="card get ${c.shiny?'urcard':''}"><div class="mon">${art(c.id,c.lv,{shiny:c.shiny})}</div><div><b>${c.shiny?'色ちがいの ':''}${esc(nameOf(c.id,c.lv))}</b><span>${c.shiny?'こうげき・HP 1.2倍の色ちがい！':c.dup?'もういたのでパワーアップ':'あたらしいなかま！ずかんに登録'}</span></div></div>`)
  ].join("");
  const ups = Object.entries(B.lvups).filter(([id])=>!B.evoReady.includes(id)).map(([id,lv])=>`${esc(nameOf(id))} Lv.${lv}`).join("・");
  app.innerHTML = `<div class="result">
    <h2>${win?(B.sid==="review"?'ニガテの森クリア！':'ルートクリア！'):'目の前がまっくらになった…'}</h2>
    ${win?`<div class="big">${starStr(stars)}</div><p class="line">まちがい ${B.mistakes}回・さいだい ${B.maxCombo}コンボ・たおした ${B.defeated}ひき</p><p class="line">フラスコ +${3+B.ballsGot+B.extraBalls}${B.extraBalls?`（はじめてのクリア・はじめての★3 ボーナス +${B.extraBalls}）`:''}</p>`:`<p class="line">まちがえた問題は「ニガテの森」で練習できるよ</p>`}
    ${ups?`<p class="line">レベルアップ：${ups}</p>`:''}
    ${newMovesHTML()}
    <div class="gets">${gets}</div>
    ${B.evoReady.length?`<button class="btn go" id="toEvo">しんかさせにいく！</button>`:''}
    <button class="btn ${B.evoReady.length?'':'go'}" id="again">${win?'もう一度ぼうけん':'リベンジする'}</button>
    <button class="btn alt" id="map">マップにもどる</button></div>`;
  const u=B.u.id, s=B.sid, er=B.evoReady[0];
  if(er) document.getElementById("toEvo").onclick=()=>{ B=null; tab="party"; partySel=er; home(); };
  document.getElementById("again").onclick=()=>{ if(s==="review" && !Object.keys(save.wrong).some(k=>k.startsWith(u+"|"))) return home(); startBattle(u,s); };
  document.getElementById("map").onclick=()=>{ B=null; tab="adv"; home(); };
}
