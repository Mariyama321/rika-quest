<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>理科クエスト</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="理科クエスト">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7fcbff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: phone-first single column. Adventure tab = hillside hero + route cards; battle = grass field (wild top-right, partner bottom-left) above the question panel; bottom tab bar. */
:root{
  --sky:#7fcbff; --sky2:#dff3ff; --grass:#74c94f; --grass2:#4fa636; --bg:#eef8e6;
  --ink:#24324a; --muted:#5d6c86; --panel:#ffffff; --soft:#f3f8fc;
  --sun:#ffcf3a; --accent:#ff7a2f; --good:#24a865; --bad:#e8475a;
  --t-mizu:#3d8bff; --t-hono:#ff6a2b; --t-kusa:#34a853; --t-iwa:#a0784b;
  --t-denki:#e0a400; --t-koori:#2fb3d9; --t-kaze:#8a7bf0; --t-hikari:#f06aa8;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky2) 0,var(--bg) 320px) var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-block:12px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.dsp{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.chip{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:999px;padding:0 8px;line-height:20px;white-space:nowrap}
.t-mizu{background:var(--t-mizu)}.t-hono{background:var(--t-hono)}.t-kusa{background:var(--t-kusa)}.t-iwa{background:var(--t-iwa)}.t-denki{background:var(--t-denki)}.t-koori{background:var(--t-koori)}.t-kaze{background:var(--t-kaze)}.t-hikari{background:var(--t-hikari)}
.bar{height:9px;background:#dfe6ee;border-radius:6px;overflow:hidden;border:2px solid var(--ink)}
.bar>i{display:block;height:100%;transition:width .45s}
.hpbar>i{background:var(--good)}.hpbar.mid>i{background:var(--sun)}.hpbar.low>i{background:var(--bad)}
.expbar>i{background:var(--t-mizu)}
.btn{display:block;width:100%;border:3px solid var(--ink);border-radius:14px;padding:11px 14px;font-family:var(--display);font-size:18px;box-shadow:0 4px 0 var(--ink);background:var(--sun)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45}
.btn.alt{background:var(--panel)}
.btn.go{background:var(--accent);color:#fff}
.mon svg{display:block;width:100%;height:100%;overflow:visible}

/* hero */
.hero{position:relative;overflow:hidden;border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 62%);padding:18px 18px 0;min-height:230px}
.hero .sun{position:absolute;right:22px;top:16px;width:54px;height:54px;border-radius:50%;background:var(--sun);border:3px solid var(--ink)}
.hero .hill{position:absolute;left:-10%;right:-10%;bottom:-70px;height:150px;background:var(--grass);border-top:3px solid var(--ink);border-radius:50% 50% 0 0}
.hero .hill2{position:absolute;right:-30%;width:80%;bottom:-40px;height:110px;background:var(--grass2);border-top:3px solid var(--ink);border-radius:50% 50% 0 0}
.hero h1{position:relative;font-size:38px;line-height:1.1;color:var(--ink)}
.hero p{position:relative;margin:4px 0 0;font-weight:800;font-size:13px;color:var(--muted)}
.hero .lead{position:absolute;left:18px;bottom:8px;width:104px;height:104px}
.hero .stats{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:1px 12px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:18px}

.subj{display:flex;margin-top:18px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.subj button{flex:1;border:none;background:var(--panel);font-family:var(--display);font-size:18px;padding:8px 0}
.subj button+button{border-left:3px solid var(--ink)}
.subj button.on{background:var(--sun)}
.qbars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;margin-top:6px;font-size:12.5px}
.qb-l{font-weight:800;white-space:nowrap}
.qb-t{height:12px;background:#fff;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.qb-t i{display:block;height:100%;background:#2f6fd6}
.qb-v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ordrow{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}
.ordrow .btn{font-size:16px;padding:9px 6px;white-space:nowrap}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mbtn{display:flex;align-items:center;gap:6px;text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--soft);padding:8px;font-size:14px;font-weight:500;min-height:48px;line-height:1.3;overflow-wrap:anywhere}
.mbtn .k{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;display:grid;place-items:center;font-weight:800}
.mbtn.cur{background:#fff4d6;border-width:3px}
.mbtn.R.ready{border-style:dashed}
.mbtn.ok{background:#dcf5e8;border-color:var(--good)}
.mbtn.ng{background:#ffe1e5;border-color:var(--bad)}
.regions{display:flex;gap:10px;overflow-x:auto;margin:18px -4px 0;padding:4px 4px 10px;scroll-snap-type:x mandatory}
.region{flex:0 0 72%;max-width:260px;scroll-snap-align:center;text-align:left;padding:10px 14px;display:flex;flex-direction:column;background:var(--soft);box-shadow:0 3px 0 var(--ink)}
.region.on{background:var(--grass);color:#fff}
.region .rno{font-size:11px;font-weight:800;opacity:.8}
.region b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.3}
.region .rsub{font-size:12px;font-weight:800;opacity:.85}
.unit{margin-top:22px}
.unit-head{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-bottom:10px}
.unit-no{white-space:nowrap;font-family:var(--display);font-size:13px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 8px}
.unit-head h2{font-size:21px}
.unit-head .sub{white-space:nowrap;margin-left:auto;font-size:12px;color:var(--muted);font-weight:800}
.routes{display:flex;flex-direction:column;gap:12px}
.route{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;width:100%;text-align:left;padding:10px 14px}
.route:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.route .rn{font-size:11px;font-weight:800;color:var(--grass2);letter-spacing:.08em}
.route b{display:block;font-family:var(--display);font-weight:400;font-size:17px;line-height:1.3}
.route .note{font-size:12px;color:var(--muted)}
.route .wilds{grid-column:1/-1;display:flex;gap:6px;margin-top:2px}
.route .wilds .mon{width:36px;height:36px;background:var(--soft);border-radius:50%;border:2px solid #d5dee8;padding:2px}
.stars{font-family:var(--display);color:var(--sun);-webkit-text-stroke:1px var(--ink);font-size:20px;letter-spacing:1px;white-space:nowrap}
.stars .off{color:#dfe6ee}
.route.boss{background:#fff4d6}
.route.review{background:#ffeef0;border-style:dashed}
.route[disabled]{opacity:.55}
.tools{text-align:center;margin-top:26px;font-size:12px;color:var(--muted)}
.tools button{background:none;border:none;text-decoration:underline;color:var(--muted);padding:6px}
.confirm{display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px}
.confirm button{border:2px solid var(--ink);background:var(--panel);border-radius:8px;padding:3px 12px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:3px solid var(--ink);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs[hidden]{display:none}
.tabs button{flex:1;max-width:130px;background:none;border:none;padding:8px 0 6px;font-weight:800;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--ink)}
.tabs button.on svg{transform:translateY(-2px)}

/* starter */
.prof{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px}
.prof.gift{width:100%;background:#fff4d6;animation:enter .5s}
.prof .face{flex:none;width:52px;height:52px}
.prof p{margin:0;font-weight:800}
.starters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.starter{padding:10px 6px;text-align:center}
.starter .mon{width:84px;height:84px;margin:0 auto}
.starter b{display:block;font-family:var(--display);font-weight:400;font-size:15px}
.starter.sel{background:#fff4d6;transform:translateY(-4px)}
.skilltxt{font-size:12px;color:var(--muted);line-height:1.4}

/* battle */
.btop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.back{border:2px solid var(--ink);background:var(--panel);border-radius:10px;padding:2px 10px;font-size:13px;font-weight:800}
.hearts{display:flex;gap:2px;margin-left:auto}
.hearts svg{width:20px;height:20px}
.field{position:relative;height:250px;overflow:hidden;border:3px solid var(--ink);border-radius:18px;background:linear-gradient(180deg,var(--sky) 0,var(--sky2) 58%,var(--grass) 58%,var(--grass2) 100%)}
.field .plat{position:absolute;border-radius:50%;background:#8fd86a;border:3px solid var(--ink)}
.plat.w{right:14px;top:96px;width:150px;height:34px}
.plat.m{left:6px;bottom:18px;width:160px;height:36px}
.field .mon{position:absolute;transition:transform .3s,opacity .3s}
#wildMon{right:30px;top:12px;width:118px;height:118px}
#meMon{left:22px;bottom:30px;width:128px;height:128px}
#meMon svg{transform:scaleX(-1)}
.info{position:absolute;background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:4px 10px 6px;width:168px}
.info .nm{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px;line-height:1.4}
.info .nm .lv{margin-left:auto;font-variant-numeric:tabular-nums}
.info .nm{flex-wrap:wrap;row-gap:0}.info .nmt{white-space:nowrap}.info .nm .chip{font-size:10px;padding:0 5px;line-height:16px}
.info .nums{font-size:11px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.info.w{left:10px;top:10px}
.info.m{right:10px;bottom:12px}
.flask{position:absolute;width:30px;height:36px;left:90px;bottom:120px;z-index:5;pointer-events:none}
.flask.fly{animation:fly .6s cubic-bezier(.3,.1,.6,1) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(90px,-110px) rotate(200deg)}100%{transform:translate(184px,-62px) rotate(360deg)}}
.flask.wob{animation:wob .5s ease-in-out}
@keyframes wob{0%,100%{transform:translate(184px,-62px) rotate(0)}30%{transform:translate(184px,-62px) rotate(-22deg)}70%{transform:translate(184px,-62px) rotate(22deg)}}
.flask.rest{transform:translate(184px,-62px)}
.mon.suck{transform:scale(.05);opacity:0}
.mon.hit{animation:hit .45s}
.mon.lunge{animation:lunge .45s}
.mon.lunge2{animation:lunge2 .45s}
.mon.faint{transform:translateY(60px);opacity:0;transition:transform .6s,opacity .6s}
.mon.enter{animation:enter .5s}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(-8px);filter:brightness(1.8)}50%{transform:translateX(7px)}}
@keyframes lunge{40%{transform:translate(40px,-24px)}}
@keyframes lunge2{40%{transform:translate(-40px,26px)}}
@keyframes enter{from{transform:translateX(120px);opacity:0}}
.dmg{position:absolute;font-family:var(--display);font-size:26px;color:#fff;-webkit-text-stroke:2px var(--ink);right:70px;top:40px;animation:pop .9s forwards;pointer-events:none;z-index:6}
.dmg.big{color:var(--sun);font-size:30px}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
.log{margin-top:8px;min-height:48px;padding:6px 12px;font-weight:800;font-size:14px;line-height:1.5;border:3px solid var(--ink);border-radius:12px;background:var(--panel)}
.qpanel{margin-top:12px;padding:14px;position:relative}
.rlock{position:absolute;left:6px;right:6px;z-index:4;background:rgba(255,255,255,.6);border-radius:12px;display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:8px}
.rlock span{font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:3px 14px;font-size:14px}
.rlock i{display:block;width:60%;height:8px;border-radius:5px;background:#dfe6ee;border:2px solid var(--ink);overflow:hidden}
.rlock i b{display:block;height:100%;width:0;background:var(--accent);animation:rlk linear forwards}
@keyframes rlk{to{width:100%}}
.hasty{color:var(--bad)}
.sztag.strongtag{background:var(--bad)}
.sztag.shinytag{background:linear-gradient(90deg,#ff5a6e,#ffb84d,#3d8bff)}
.plog summary{font-weight:800;cursor:pointer}
.mispanel{padding:10px 12px}
.mispanel summary{cursor:pointer}
.misrow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:4px 0}
.misrow b{font-size:14px;display:block}.misrow .bar{margin-top:3px}
.misck{width:24px;height:24px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.misrow.done .misck{background:var(--good)}.misrow.done b{color:var(--muted)}
.umrow{display:flex;justify-content:space-between;gap:6px;font-size:12px;padding:4px 0;border-bottom:1px dashed #d5dee8}
.umrow i{font-style:normal;font-size:10px;font-weight:800;border:1.5px solid #c9d3e0;border-radius:6px;padding:0 4px;margin-left:3px;color:var(--muted);white-space:nowrap}
.umrow i.on{background:var(--sun);border-color:var(--ink);color:var(--ink)}
.smlist{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.smrow{padding:4px 6px;border-radius:8px;background:var(--soft)}.smrow b{display:block;font-size:13px}.smrow.on{background:#fff4d6}
.mvup{display:block;margin-top:3px;border:1.5px solid var(--ink);border-radius:6px;background:#ffe9d6;font-size:10.5px;font-weight:800;padding:1px 4px}
.smpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.smpick button{border:2px solid var(--ink);border-radius:999px;background:var(--soft);font-size:12px;font-weight:800;padding:2px 10px}
.smpick button.on{background:var(--sun)}
.pgcard{padding:10px 12px;margin-top:4px}.pgtitle{font-family:var(--display);font-weight:400;font-size:17px;display:block}
.pgbox{margin:10px auto;width:200px;height:200px;max-width:70%;background:#eef6ff;border:3px solid var(--ink);border-radius:16px;padding:10px}
.pgshape{display:block;width:100%;height:100%}
.pgmiss{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.pgmiss>div{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:800;width:46%}
.pgmini{width:44px;height:44px;flex:none}.pgmini svg{width:100%;height:100%}
.shophead{display:flex;gap:10px;align-items:center;padding:8px 12px;flex-wrap:wrap}
.shopmsg{font-weight:800;color:var(--good);margin:10px 0 0}
.shopcat{font-size:16px;margin:14px 0 8px}
.shopgrid{display:flex;flex-direction:column;gap:8px}
.shopgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sitem2{display:grid;grid-template-columns:32px 1fr;gap:4px 6px;align-items:center;padding:6px 8px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
.sitem2 .sic svg{width:30px;height:30px}.sitem2 .sin b{font-size:13px}.sitem2 .sbuy{grid-column:1/-1;justify-content:center;width:100%;padding:4px}
.sitem{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
.sic svg{width:40px;height:40px;display:block}
.sin b{display:block;font-size:14px;line-height:1.3}.sin .mini{display:block;font-weight:700;line-height:1.35}
.sbuy{width:auto;font-size:15px;padding:6px 10px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.sbuy svg{width:14px;height:17px}
.btcard{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.btteam{display:flex;gap:6px}.btteam .mon{width:64px;height:64px}
.btcard b{display:block}
.badge{gap:0}.badge .mon{width:48px;height:48px}.badge .mini{font-size:10.5px;line-height:1.3}
.badge:not(.on){opacity:.7}
.ddrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px dashed #d5dee8}.ddrow:last-child{border:none}
.ddrow b{white-space:nowrap}
.bag{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.bag button{flex:1;min-width:120px;border:2px solid var(--ink);border-radius:10px;background:var(--soft);padding:4px 8px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;text-align:left}
.bag button svg{width:28px;height:28px;flex:none}
.bag button:disabled{opacity:.4}
.itembtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.itembtns .btn{width:auto;flex:1;min-width:140px;font-size:13px;padding:7px 8px}
.plog table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px;font-variant-numeric:tabular-nums}
.plog th,.plog td{border:1.5px solid #c9d6e6;padding:2px 4px;text-align:center}
.plog th{background:var(--soft)}
.plog td.warn{background:#ffe1e5;font-weight:800}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.qtext{font-size:18px;font-weight:800;margin:4px 0 0;line-height:1.5}
.qnote{margin-top:8px;background:#eef6ff;border:2px solid var(--t-mizu);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.5}
.qnote-h{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--t-mizu);border-radius:999px;padding:0 8px;line-height:18px;margin-bottom:4px}
.qnote p{margin:0}
.qtbl{overflow-x:auto;margin-top:6px}
.qgraph{margin-top:6px;max-width:360px}
.qgraph svg{display:block;width:100%;height:auto}
.qtbl table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;background:#fff}
.qtbl th,.qtbl td{border:1.5px solid var(--ink);padding:2px 4px;font-size:12px;text-align:center;white-space:nowrap}
.qtbl th{background:#dbeafe;font-weight:800}
.hint{font-size:13px;color:var(--accent);font-weight:800}
.choices{display:grid;gap:9px;margin-top:12px}
.choice{width:100%;text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--soft);padding:10px 12px;font-size:16px;font-weight:500;display:flex;gap:10px;align-items:center}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:800}

/* evolution */
.evotag{font-size:10px;font-weight:800;color:#fff;background:var(--accent);border-radius:999px;padding:0 8px;line-height:18px}
.evobtn{margin-top:12px}
.evo-stage{margin-top:8px;border:3px solid var(--ink);border-radius:20px;background:radial-gradient(circle at 50% 45%,#3b4a7a 0,#1c2440 70%);color:#fff;text-align:center;padding:22px 16px 18px;overflow:hidden}
.evo-msg{font-size:17px;font-weight:800;min-height:56px;margin:0}
.evo-box{position:relative;width:220px;height:220px;margin:6px auto 10px;max-width:100%}
.evo-box .mon{position:absolute;inset:0}
.evo-glow{position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle,#fff6c9 0,rgba(255,246,201,0) 70%);opacity:0;transform:scale(.5)}
.evo-b{opacity:0}
.run .evo-a,.run .evo-b{filter:brightness(0) invert(1)}
.run .evo-a{animation:evoA 3.3s linear forwards}
.run .evo-b{animation:evoB 3.3s linear forwards}
.run .evo-glow{animation:glow 3.3s ease-in forwards}
@keyframes evoA{0%,14%{opacity:1}15%,24%{opacity:0}25%,37%{opacity:1}38%,45%{opacity:0}46%,55%{opacity:1}56%,61%{opacity:0}62%,68%{opacity:1}69%,73%{opacity:0}74%,78%{opacity:1}79%,82%{opacity:0}83%,86%{opacity:1}87%,100%{opacity:0}}
@keyframes evoB{0%,14%{opacity:0}15%,24%{opacity:1}25%,37%{opacity:0}38%,45%{opacity:1}46%,55%{opacity:0}56%,61%{opacity:1}62%,68%{opacity:0}69%,73%{opacity:1}74%,78%{opacity:0}79%,82%{opacity:1}83%,86%{opacity:0}87%,100%{opacity:1}}
@keyframes glow{0%{opacity:0;transform:scale(.5)}80%{opacity:.7;transform:scale(1)}100%{opacity:1;transform:scale(1.6)}}
.done .evo-a{opacity:0}
.done .evo-b{opacity:1;animation:evoPop .6s}
.done .evo-glow{opacity:.35;transform:scale(1.2)}
@keyframes evoPop{0%{transform:scale(.6);filter:brightness(3)}60%{transform:scale(1.12)}100%{transform:none;filter:none}}
.spark{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;background:var(--sun);border-radius:2px;transform:rotate(45deg);opacity:0}
.done .spark{animation:spark .9s ease-out forwards}
.done .spark:nth-of-type(1){--x:-100px;--y:-70px}.done .spark:nth-of-type(2){--x:100px;--y:-80px}.done .spark:nth-of-type(3){--x:-110px;--y:40px}.done .spark:nth-of-type(4){--x:110px;--y:50px}
.done .spark:nth-of-type(5){--x:0px;--y:-110px}.done .spark:nth-of-type(6){--x:-40px;--y:100px}.done .spark:nth-of-type(7){--x:50px;--y:100px}.done .spark:nth-of-type(8){--x:-70px;--y:-10px}
@keyframes spark{0%{opacity:1;transform:translate(0,0) rotate(45deg) scale(.6)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(225deg) scale(1.2)}}
.evo-btns{display:flex;flex-direction:column;gap:10px;min-height:52px}

.pk{font-family:var(--display);font-size:22px;padding:10px 0;border:2px solid var(--ink);border-radius:12px;background:var(--soft);box-shadow:0 3px 0 var(--ink)}
.pk.sel{background:#fff4d6;border-width:3px}
.pk.ok{background:#dcf5e8;border-color:var(--good)}.pk.ng{background:#ffe1e5;border-color:var(--bad)}.pk.miss{background:#fff;border:3px dashed var(--good);color:var(--good)}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.phc{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:4px 0 6px;display:flex;flex-direction:column;align-items:center}
.phc .mon{width:62px;height:62px}
.phc b{font-family:var(--display);font-size:26px;line-height:1}
.phc.pop{animation:ppop .25s forwards;background:#dcf5e8}
.phc.bad{background:#ffe1e5;border-color:var(--bad)}
@keyframes ppop{to{transform:scale(.6);opacity:0}}
.choices.allgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.choices.allgrid .choice{justify-content:center;font-family:var(--display);font-size:20px;padding:10px 4px}
.qimg{margin:8px auto 2px;width:170px;max-width:62%;aspect-ratio:1;background:#fff;border:3px solid var(--ink);border-radius:16px;overflow:hidden;padding:6px;box-shadow:0 3px 0 var(--ink)}.qimg img{display:block;width:100%;height:100%;object-fit:contain}
[hidden]{display:none!important}
.updbar{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:50;border:3px solid var(--ink);border-radius:14px;background:var(--accent);color:#fff;font-family:var(--display);font-size:17px;padding:12px;box-shadow:0 4px 0 var(--ink)}
.urcard{width:100%;border-color:#8f6bff;box-shadow:0 4px 0 #8f6bff;background:linear-gradient(120deg,#fff0f6,#fff9d6,#e6fff4,#e8f1ff,#f3e8ff)}
.urcell{background:linear-gradient(120deg,#fff0f6,#fff9d6,#e8f1ff)}
.ursvg{animation:urfloat 3s ease-in-out infinite}
@keyframes urfloat{50%{transform:translateY(-3px)}}
.urstage{background:radial-gradient(circle at 50% 45%,#7a5cff 0,#2a1f5a 70%)}
.fracpanel{margin-top:12px;padding:10px 12px;background:linear-gradient(135deg,#fff0f6,#f3e8ff)}
.fphead{display:flex;gap:10px;align-items:center}
.fphead .mon{width:64px;height:64px;flex:none}
.fphead b{display:block;font-family:var(--display);font-weight:400;font-size:17px}
.fpcards{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.fpc{border:2px dashed #c8d2de;border-radius:10px;padding:5px 8px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:13px}
.fpc.part{border-style:solid;border-color:var(--ink)}
.fpc.full{border:2px solid #8f6bff;background:#f3e8ff}
.fpc i{font-style:normal;color:var(--sun);-webkit-text-stroke:.6px var(--ink);white-space:nowrap}.fpc i .off{color:#dfe6ee}

  stages:[{"id": "s1", "name": "北海道・東北のマーク", "note": "北海道・東北地方の7道県", "wild": ["nanaboshin", "hagimin", "juhyon"], "qs": [{"img": "hokkaido", "q": "このマークはどの都道府県のもの？", "c": ["北海道", "秋田県", "宮城県", "青森県"], "a": 0, "e": "北海道のマーク。北海道開拓使の旗の「五稜星（5つのとがった星）」をもとにした「七稜星」。開拓者精神と、伸びゆく北海道の未来を表す。"}, {"img": "aomori", "q": "このマークはどの都道府県のもの？", "c": ["青森県", "山形県", "宮城県", "北海道"], "a": 0, "e": "青森県のマーク。青森県の地形（形）をシンプルにデザインしたもの。深緑色は「希望」と「未来」を表す。"}, {"img": "iwate", "q": "このマークはどの都道府県のもの？", "c": ["岩手県", "山形県", "福島県", "北海道"], "a": 0, "e": "岩手県のマーク。「岩」の字を上下対称にデザインしたもの。"}, {"img": "miyagi", "q": "このマークはどの都道府県のもの？", "c": ["宮城県", "岩手県", "秋田県", "青森県"], "a": 0, "e": "宮城県のマーク。県花「ミヤギノハギ」の葉の形と、宮城の「み」の字を組み合わせたもの。"}, {"img": "akita", "q": "このマークはどの都道府県のもの？", "c": ["秋田県", "宮城県", "北海道", "福島県"], "a": 0, "e": "秋田県のマーク。秋田の頭文字、カタカナの「ア」をデザインしたもの。飛躍し発展する姿を表す。"}, {"img": "yamagata", "q": "このマークはどの都道府県のもの？", "c": ["山形県", "岩手県", "青森県", "北海道"], "a": 0, "e": "山形県のマーク。山形の「山」と「最上川」をもとにしたもの。とがった山の形は発展を、白は蔵王の樹氷や雪を表す。"}, {"img": "fukushima", "q": "このマークはどの都道府県のもの？", "c": ["福島県", "山形県", "秋田県", "宮城県"], "a": 0, "e": "福島県のマーク。福島の頭文字、ひらがなの「ふ」をデザインしたもの。県民の融和と団結を表す。"}]}, {"id": "s2", "name": "関東のマーク", "note": "関東地方の7都県", "wild": ["magatamun", "barabon", "nanaboshin"], "qs": [{"img": "ibaraki", "q": "このマークはどの都道府県のもの？", "c": ["茨城県", "千葉県", "東京都", "栃木県"], "a": 0, "e": "茨城県のマーク。県花「バラ」のつぼみをデザインしたもの。うずまきは躍動と発展を表す。"}, {"img": "tochigi", "q": "このマークはどの都道府県のもの？", "c": ["栃木県", "千葉県", "埼玉県", "群馬県"], "a": 0, "e": "栃木県のマーク。「栃」の字をデザインしたもの。左上の3本の矢印は「木へん」の古代文字。"}, {"img": "gunma", "q": "このマークはどの都道府県のもの？", "c": ["群馬県", "東京都", "埼玉県", "神奈川県"], "a": 0, "e": "群馬県のマーク。「群」の古い字体「羣」のまわりに、上毛三山（赤城山・榛名山・妙義山）を配置したもの。"}, {"img": "saitama", "q": "このマークはどの都道府県のもの？", "c": ["埼玉県", "茨城県", "神奈川県", "群馬県"], "a": 0, "e": "埼玉県のマーク。県名の由来「さきたま」を意味する勾玉（まがたま）を、円形に16個ならべたもの。円は太陽を表す。"}, {"img": "chiba", "q": "このマークはどの都道府県のもの？", "c": ["千葉県", "茨城県", "神奈川県", "埼玉県"], "a": 0, "e": "千葉県のマーク。カタカナの「チ」と「ハ」の2文字を組み合わせたもの。"}, {"img": "tokyo", "q": "このマークはどの都道府県のもの？", "c": ["東京都", "神奈川県", "茨城県", "千葉県"], "a": 0, "e": "東京都のマーク。東京都章。中心の太陽から光がさすイメージで、日本の中心としての発展を表す。（イチョウのような緑の「T」は、都章とは別のシンボルマーク）"}, {"img": "kanagawa", "q": "このマークはどの都道府県のもの？", "c": ["神奈川県", "埼玉県", "茨城県", "東京都"], "a": 0, "e": "神奈川県のマーク。「神」の字を左右対称にデザインしたもの。"}]}, {"id": "s3", "name": "中部のマーク", "note": "中部地方の9県", "wild": ["tateyaman", "asahin", "barabon"], "qs": [{"img": "niigata", "q": "このマークはどの都道府県のもの？", "c": ["新潟県", "岐阜県", "富山県", "長野県"], "a": 0, "e": "新潟県のマーク。新潟県章。中央上の「新」の字と、左上の「ガ」、右上の「タ」を円で結んだもの。"}, {"img": "toyama", "q": "このマークはどの都道府県のもの？", "c": ["富山県", "山梨県", "石川県", "新潟県"], "a": 0, "e": "富山県のマーク。立山をモチーフにしたもの。2つの山が交わる部分にひらがなの「と」がある。"}, {"img": "ishikawa", "q": "このマークはどの都道府県のもの？", "c": ["石川県", "静岡県", "福井県", "長野県"], "a": 0, "e": "石川県のマーク。能登半島の形と「石川」の文字をもとにしたもの。石川県には県章がなく、県旗の標章を使っている。"}, {"img": "fukui", "q": "このマークはどの都道府県のもの？", "c": ["福井県", "石川県", "静岡県", "長野県"], "a": 0, "e": "福井県のマーク。カタカナの「フ」「ク」「イ」の3文字を組み合わせたもの。双葉から若葉がのびる様子を表す。"}, {"img": "yamanashi", "q": "このマークはどの都道府県のもの？", "c": ["山梨県", "富山県", "福井県", "愛知県"], "a": 0, "e": "山梨県のマーク。「山」の字を3つの「人」の字で表し、まわりのわくは武田氏の家紋「武田菱」と富士山を表す。"}, {"img": "nagano", "q": "このマークはどの都道府県のもの？", "c": ["長野県", "静岡県", "愛知県", "山梨県"], "a": 0, "e": "長野県のマーク。カタカナの「ナ」を鳥が飛ぶ姿で円の中に置いたもの。湖面に山がうつる景色にも見える。"}, {"img": "gifu", "q": "このマークはどの都道府県のもの？", "c": ["岐阜県", "静岡県", "富山県", "長野県"], "a": 0, "e": "岐阜県のマーク。岐阜県章。「岐」の字をデザインしたもの。（「G」をデザインした別のシンボルマークもある）"}, {"img": "shizuoka", "q": "このマークはどの都道府県のもの？", "c": ["静岡県", "富山県", "石川県", "新潟県"], "a": 0, "e": "静岡県のマーク。富士山と、御前崎・伊豆半島・駿河湾からなる静岡の地形を表したもの。"}, {"img": "aichi", "q": "このマークはどの都道府県のもの？", "c": ["愛知県", "福井県", "石川県", "新潟県"], "a": 0, "e": "愛知県のマーク。ひらがなの「あ・い・ち」を組み合わせたもの。朝日と波（旭日波頭）も表している。"}]}, {"id": "s4", "name": "近畿のマーク", "note": "近畿地方の7府県", "wild": ["shinjun", "sensun", "asahin"], "qs": [{"img": "mie", "q": "このマークはどの都道府県のもの？", "c": ["三重県", "兵庫県", "大阪府", "奈良県"], "a": 0, "e": "三重県のマーク。三重の「み」の字を上向きの矢印とデザインしたもの。左下の円は「真珠」を表す。"}, {"img": "shiga", "q": "このマークはどの都道府県のもの？", "c": ["滋賀県", "大阪府", "三重県", "兵庫県"], "a": 0, "e": "滋賀県のマーク。カタカナの「シ」と「ガ」を円形に組み合わせたもの。左右の翼は県の発展を表す。"}, {"img": "kyoto", "q": "このマークはどの都道府県のもの？", "c": ["京都府", "兵庫県", "三重県", "大阪府"], "a": 0, "e": "京都府のマーク。古都をイメージした6枚の葉の中に、「京」の字を人文字で表したもの。"}, {"img": "osaka", "q": "このマークはどの都道府県のもの？", "c": ["大阪府", "京都府", "兵庫県", "滋賀県"], "a": 0, "e": "大阪府のマーク。豊臣秀吉の「千成びょうたん」をモチーフに、大阪の頭文字「O」を使ってデザインしたもの。"}, {"img": "hyogo", "q": "このマークはどの都道府県のもの？", "c": ["兵庫県", "大阪府", "滋賀県", "奈良県"], "a": 0, "e": "兵庫県のマーク。「兵」の字を波の形にデザインしたもの。上下の青は、北の日本海と南の瀬戸内海を表す。（この画像は県旗）"}, {"img": "nara", "q": "このマークはどの都道府県のもの？", "c": ["奈良県", "滋賀県", "三重県", "兵庫県"], "a": 0, "e": "奈良県のマーク。カタカナの「ナ」をデザインしたもの。外の大きな円は奈良の自然を表す。"}, {"img": "wakayama", "q": "このマークはどの都道府県のもの？", "c": ["和歌山県", "大阪府", "滋賀県", "三重県"], "a": 0, "e": "和歌山県のマーク。カタカナの「ワ」をえんぎのよい扇の形にしたもの。末広がりに発展する姿を表す。"}]}, {"id": "s5", "name": "中国・四国のマーク", "note": "中国・四国地方の9県", "wild": ["torin", "izumon", "sensun"], "qs": [{"img": "tottori", "q": "このマークはどの都道府県のもの？", "c": ["鳥取県", "香川県", "山口県", "島根県"], "a": 0, "e": "鳥取県のマーク。ひらがなの「と」を「鳥」の形にデザインしたもの。"}, {"img": "shimane", "q": "このマークはどの都道府県のもの？", "c": ["島根県", "山口県", "鳥取県", "広島県"], "a": 0, "e": "島根県のマーク。カタカナの「マ」を4つ（4マ＝シマ）円形にならべ、雲（出雲）の形にしたもの。"}, {"img": "okayama", "q": "このマークはどの都道府県のもの？", "c": ["岡山県", "徳島県", "鳥取県", "愛媛県"], "a": 0, "e": "岡山県のマーク。「岡」の字を円形にデザインしたもの。"}, {"img": "hiroshima", "q": "このマークはどの都道府県のもの？", "c": ["広島県", "愛媛県", "鳥取県", "山口県"], "a": 0, "e": "広島県のマーク。カタカナの「ヒ」を2重の円の形にデザインしたもの。"}, {"img": "yamaguchi", "q": "このマークはどの都道府県のもの？", "c": ["山口県", "鳥取県", "岡山県", "徳島県"], "a": 0, "e": "山口県のマーク。「山」と「口」の字を組み合わせたもの。太陽に向かってはばたく鳥のイメージ。"}, {"img": "tokushima", "q": "このマークはどの都道府県のもの？", "c": ["徳島県", "広島県", "山口県", "鳥取県"], "a": 0, "e": "徳島県のマーク。ひらがなの「とく」の2文字を鳥の形にデザインしたもの。"}, {"img": "kagawa", "q": "このマークはどの都道府県のもの？", "c": ["香川県", "徳島県", "島根県", "愛媛県"], "a": 0, "e": "香川県のマーク。カタカナの「カ」をデザインしたもの。山なみと、県花・県木のオリーブの葉をイメージ。"}, {"img": "ehime", "q": "このマークはどの都道府県のもの？", "c": ["愛媛県", "徳島県", "高知県", "鳥取県"], "a": 0, "e": "愛媛県のマーク。愛媛県章。特産のみかんと、太陽（赤）・自然（緑）・瀬戸内海（青）の恵みを表す。"}, {"img": "kochi", "q": "このマークはどの都道府県のもの？", "c": ["高知県", "島根県", "鳥取県", "広島県"], "a": 0, "e": "高知県のマーク。カタカナの「コ」と、旧国名「とさ」のひらがなを円形にデザインしたもの。上につき出た剣先は県の向上を表す。"}]}, {"id": "s6", "name": "九州・沖縄のマーク", "note": "九州・沖縄地方の8県", "wild": ["umehanan", "hatopi", "izumon"], "qs": [{"img": "fukuoka", "q": "このマークはどの都道府県のもの？", "c": ["福岡県", "大分県", "宮崎県", "熊本県"], "a": 0, "e": "福岡県のマーク。県花「梅の花」と、ひらがなの「ふ・く」をモチーフにしたもの。"}, {"img": "saga", "q": "このマークはどの都道府県のもの？", "c": ["佐賀県", "宮崎県", "大分県", "長崎県"], "a": 0, "e": "佐賀県のマーク。佐賀県章。カタカナの「カ」を3つ円形にならべたもの（3カ＝サガ）。"}, {"img": "nagasaki", "q": "このマークはどの都道府県のもの？", "c": ["長崎県", "宮崎県", "大分県", "佐賀県"], "a": 0, "e": "長崎県のマーク。長崎の頭文字「N」と、平和の象徴「ハト」をデザインしたもの。"}, {"img": "kumamoto", "q": "このマークはどの都道府県のもの？", "c": ["熊本県", "福岡県", "沖縄県", "佐賀県"], "a": 0, "e": "熊本県のマーク。カタカナの「ク」を九州の形にデザインしたもの。中央の円は九州の真ん中にある熊本県を表す。"}, {"img": "oita", "q": "このマークはどの都道府県のもの？", "c": ["大分県", "福岡県", "沖縄県", "長崎県"], "a": 0, "e": "大分県のマーク。「大」の字をデザインしたもの。丸い円は県民の輪を表す。"}, {"img": "miyazaki", "q": "このマークはどの都道府県のもの？", "c": ["宮崎県", "沖縄県", "鹿児島県", "長崎県"], "a": 0, "e": "宮崎県のマーク。旧国名「日向」の文字をデザインしたもの。中央の「日」から3方向にのびる「向」。"}, {"img": "kagoshima", "q": "このマークはどの都道府県のもの？", "c": ["鹿児島県", "福岡県", "熊本県", "長崎県"], "a": 0, "e": "鹿児島県のマーク。鹿児島県章。県の地形を円形にデザインし、中央の赤い丸で「桜島」を表したもの。"}, {"img": "okinawa", "q": "このマークはどの都道府県のもの？", "c": ["沖縄県", "熊本県", "鹿児島県", "宮崎県"], "a": 0, "e": "沖縄県のマーク。沖縄の頭文字「O」の白い輪（平和）を中心に、内側の円（発展）と外側の円（海洋）で表したもの。"}]}]

const MAPK=19.7, MAPLON0=123.63, MAPY0=1008.9;
function mapProj(lon,lat){ const m=180/Math.PI*Math.log(Math.tan(Math.PI/4+lat*Math.PI/360)); return [MAPK*(lon-MAPLON0), MAPY0-MAPK*m]; }
const MAP_ALL_MAIN = Object.keys(MAPD).filter(k=>k!=="okinawa");
function mapBox(view){
  if(!view) return [0,0,438,516];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const id of view){ const [x,y,w,h]=MAPB[id]; x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x+w); y1=Math.max(y1,y+h); }
  const pad=Math.max(x1-x0,y1-y0)*.06;
  return [x0-pad,y0-pad,x1-x0+pad*2,y1-y0+pad*2];
}
/* o: {view:[id...], fill:{id:color}, sel:id, tap:bool, pts:[[label,lon,lat]], names:bool} */
function mapSVG(o={}){
  const vb=mapBox(o.view), sw=(vb[2]/300).toFixed(2), showOki=!o.view||o.view.includes("okinawa");
  let s=`<svg class="jmap" viewBox="${vb.map(v=>v.toFixed(1)).join(" ")}" role="img" aria-label="日本地図">`;
  s+=`<rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="#cfe9fb"/>`;
  if(showOki && !o.view) s+=`<rect x="0" y="418" width="130" height="98" fill="none" stroke="#24324a" stroke-width="${sw}" stroke-dasharray="3 2"/>`;
  for(const [id,[nm,d]] of Object.entries(MAPD)){
    if(id==="okinawa" && !showOki) continue;
    const f=(o.fill&&o.fill[id])||(o.sel===id?"#ffcf3a":"#f6f2e3");
    s+=`<path d="${d}" data-p="${id}" fill="${f}" stroke="#24324a" stroke-width="${sw}" stroke-linejoin="round"${o.tap?' class="tp"':''}><title>${o.names?nm:''}</title></path>`;
  }
  if(o.pts){ const r=vb[2]/55, fs=vb[2]/22;
    for(const [lab,lon,lat] of o.pts){ const [x,y]=mapProj(lon,lat);
      s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#e8475a" stroke="#fff" stroke-width="${r/3}"/>`;
      s+=`<text x="${x+r*1.6}" y="${y+fs*.35}" font-size="${fs}" font-weight="800" fill="#24324a" stroke="#fff" stroke-width="${fs/5}" paint-order="stroke">${lab}</text>`; } }

}

}

  const g=id=>document.getElementById(id);
  g("bkcopy").onclick=()=>{
    const done=()=>{ save.lastBackup=Date.now(); persist(); bkMsg="コピーしたよ！ メモアプリなどにはりつけて保存してね。"; showBackup(); };
    try{ navigator.clipboard.writeText(code).then(done, ()=>{ const t=g("bkout"); t.focus(); t.select(); bkMsg="コピーできなかったので、文字を全部えらんだよ。長おしして「コピー」してね。"; save.lastBackup=Date.now(); persist(); const m=document.querySelector(".bkmsg"); if(m) m.textContent=bkMsg; else showBackup(); }); }
    catch(e){ const t=g("bkout"); t.focus(); t.select(); }
  };
  g("bkout").onfocus=e=>e.target.select();
  g("bkload").onclick=()=>{ const o=parseBackup(g("bkin").value); if(!o){ bkPending=null; bkMsg="コードが読みとれなかったよ。さいしょの「RQ1-」から最後まで、全部はりつけてね。"; } else { bkPending=o; bkMsg=""; } showBackup(); };
  if(bkPending){ g("bkyes").onclick=()=>{ save=bkPending; bkPending=null; for(const [id,o] of Object.entries(save.owned)) if(o.form==null && SP[id]) o.form=formIdx(id,o.lv); persist(); bkMsg="きろくをもどしたよ！"; showBackup(); };
    g("bkno").onclick=()=>{ bkPending=null; bkMsg=""; showBackup(); }; }
  g("bkback").onclick=()=>{ bkMsg=""; bkPending=null; tab="adv"; home(); };
}

/* ---------- party ---------- */
let partySel = null;
function showParty(){
  const lead = save.party[0], o = save.owned[lead], s = SP[lead];
  const nf = s.forms[curF(lead)+1];
  const ids = [...UR_ORDER, ...UMEGA_ORDER, ...DEX_ORDER, ...WEEK_ORDER, ...RARE_ORDER, ...QD_ORDER, ...MEGA_ORDER].filter(id=>save.owned[id]);
  if(!partySel || !save.owned[partySel]) partySel = lead;
  const d = partySel, dO = save.owned[d], inP = save.party.includes(d);
  app.innerHTML = `<h2 class="sec-h">なかま</h2>
  <div class="card leadcard"><div class="mon">${artMine(lead)}</div><div style="min-width:0"><span class="mini">せんとう</span><h3>${esc(nameOf(lead))}</h3><div>${typesChip(lead)} <span class="mini">Lv.${o.lv}</span></div>
    <div class="bar expbar" style="margin-top:6px"><i style="width:${o.exp/need(o.lv)*100}%"></i></div><div class="mini" style="margin-top:4px">${SKILLS[s.skill].n}：${SKILLS[s.skill].d}</div>${canEvo(lead)?`<div class="mini" style="color:var(--accent)">しんかできる！</div>`:nf?`<div class="mini">${evoNeedText(nf)}でしんかできる</div>`:''}</div></div>
  <p class="mini" style="margin:16px 0 8px">パーティ（3ひきまで）は黄色。タップしてえらぼう。</p>
  <div class="grid3">${ids.map(id=>`<button class="card mcard ${save.party.includes(id)?'inparty':''}" data-id="${id}"><div class="mon">${artMine(id)}</div><b>${esc(nameOf(id))}</b><span class="mini">Lv.${save.owned[id].lv}</span>${canEvo(id)?'<span class="evotag">しんかOK</span>':''}</button>`).join("")}</div>
  <div class="card detail"><div class="row"><div class="mon">${artMine(d)}</div><div style="min-width:0"><h3>${esc(nameOf(d))}</h3><div>${typesChip(d)} <span class="mini">Lv.${dO.lv}</span></div><p class="mini">${SKILLS[SP[d].skill].n}：${SKILLS[SP[d].skill].d}</p><p class="mini">${dO.shinyWild?'<b>本物の色ちがい</b>（こうげき・HP 1.2倍）・':dO.shiny?'色ちがい（インク）・':''}さいだいHP ${maxHPOf(d)}・${sizeText(d)}</p></div></div>
    <div class="mvlist">${movesOf(d).map(k=>{ const up=((dO.mvUp||{})[k]||0); return `<span class="mvchip mt-${moveType(d,k)||'none'}"><b>${esc(MOVES[k].n)}</b><small>${moveInfo(d,k)}</small>${(bag().mvpow||0)>0&&up<5?`<button class="mvup" data-mvup="${k}">＋いりょく（${bag().mvpow}）</button>`:''}</span>`; }).join("")}</div>
    ${Object.keys(smS()).some(k=>SMV[k])?`<div class="smpick"><span class="mini">とくべつわざ：</span>${Object.keys(smS()).filter(k=>SMV[k]).map(k=>`<button class="${dO.sm==="sm_"+k?'on':''}" data-sm="${k}">${esc(SMV[k].n)}</button>`).join("")}${dO.sm?'<button data-sm="">はずす</button>':''}</div>`:''}${nextMoveText(d)}
    ${canEvo(d)?`<button class="btn go evobtn" id="evo">${esc(nameOf(d))}をしんかさせる！</button>`:(SP[d].forms[curF(d)+1]?`<p class="mini">${evoNeedText(SP[d].forms[curF(d)+1])}で、しんかできる${SP[d].forms[curF(d)+1].item?'（石はひろばのショップで買える）':''}</p>`:'')}
    ${(()=>{ const bb=bag(), o=dO, ts=[SP[d].type,SP[d].type2].filter(Boolean); let x="";
      if((bb.ame||0)>0 && o.lv<MAX_LV) x+=`<button class="btn alt" data-use="ame">ふしぎなアメ（${bb.ame}）<br><small>Lv.${o.lv}→${o.lv+1}</small></button>`;
      if((bb.ink||0)>0 && !o.shiny) x+=`<button class="btn alt" data-use="ink">ひかるインク（${bb.ink}）<br><small>色ちがいにする</small></button>`;
      for(const t of ts) if((bb["tm_"+t]||0)>0 && o.tm!=="sp_"+t) x+=`<button class="btn alt" data-use="tm_${t}">「${SPNAMES[t]}」をおぼえる<br><small>わざマシン（${bb["tm_"+t]}）${o.tm?'・今のスペシャルわざとこうかん':''}</small></button>`;
      return x?`<div class="itembtns">${x}</div>`:''; })()}
    <div class="btns">${save.party[0]!==d?`<button class="btn go" id="mklead">せんとうにする</button>`:''}${inP?(save.party.length>1?`<button class="btn alt" id="rm">パーティからはずす</button>`:''):`<button class="btn alt" id="add" ${save.party.length>=3?'disabled':''}>${save.party.length>=3?'パーティがいっぱい':'パーティに入れる'}</button>`}</div></div>
  <div class="card" style="padding:12px 14px;margin-top:14px"><b>タイプのあいしょう</b><p class="mini" style="margin:2px 0 8px">左のタイプのわざは、右のタイプに「こうかばつぐん」（2倍）。ぎゃくむきだと半分になるよ。わざのタイプで決まるので、あいてに合わせてわざをえらぼう。タイプを2つもつモンスターは、2つのあいしょうをかけ合わせる（いちばん大きくて2倍、小さくて半分）。</p>${typeChartHTML()}</div>`;
  app.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>{ partySel=b.dataset.id; showParty(); });
  const g=id=>document.getElementById(id);
  if(g("evo")) g("evo").onclick=()=>showEvolve(d);
  app.querySelectorAll("[data-mvup]").forEach(b=>b.onclick=()=>{ const k=b.dataset.mvup, o=save.owned[d], bb=bag(); if(!(bb.mvpow>0)) return; o.mvUp=o.mvUp||{}; if((o.mvUp[k]||0)>=5) return; o.mvUp[k]=(o.mvUp[k]||0)+1; bb.mvpow--; persist(); const y=window.scrollY; showParty(); window.scrollTo(0,y); });
  app.querySelectorAll("[data-sm]").forEach(b=>b.onclick=()=>{ const k=b.dataset.sm, o=save.owned[d]; if(k) o.sm="sm_"+k; else delete o.sm; persist(); const y=window.scrollY; showParty(); window.scrollTo(0,y); });
  app.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{ const k=b.dataset.use, bb=bag(), o=save.owned[d]; if(!(bb[k]>0)) return;
    if(k==="ame"){ if(o.lv>=MAX_LV) return; o.lv++; o.exp=0; }
    else if(k==="ink"){ o.shiny=true; }
    else if(k.startsWith("tm_")){ o.tm="sp_"+k.slice(3); }
    bb[k]--; persist(); showParty(); });
  if(g("mklead")) g("mklead").onclick=()=>{ save.party=[d,...save.party.filter(x=>x!==d)].slice(0,3); persist(); showParty(); };
  if(g("rm")) g("rm").onclick=()=>{ save.party=save.party.filter(x=>x!==d); persist(); showParty(); };
  if(g("add")) g("add").onclick=()=>{ if(save.party.length<3){ save.party.push(d); persist(); showParty(); } };
}
function typeChartHTML(){ return `<div class="tchart">${Object.entries(BEATS).map(([a,ds])=>`<span>${typeChip(a)}</span><span class="ar">→</span><span>${ds.map(typeChip).join(" ")}</span>`).join("")}</div>`; }

/* ---------- dex ---------- */
let dexSel = null, dexCat = "main", dexGrp = "start", dexArea = 0;
const RARE_AREAS = [["北海道・東北",0,7],["関東",7,14],["中部",14,23],["近畿",23,30],["中国・四国",30,39],["九州・沖縄",39,47]]; /* v38: ずかんは種類ボタン（dexCat）と単元ボタン（dexGrp）で切りかえ。くわしい説明はポップアップ */
function showDex(){
  const caught = DEX_ORDER.filter(id=>save.owned[id]).length, seen = DEX_ORDER.filter(id=>save.seen[id]).length;
  const cnt = ids => `${ids.filter(id=>save.owned[id]).length}/${ids.length}`;
  const CATS = [["main","ずかん",cnt(DEX_ORDER)],["rare","都道府県",cnt(RARE_ORDER)],["mega","メガ",cnt(MEGA_ORDER)],["umega","ウルトラメガ",cnt(UMEGA_ORDER)],["week","曜日",cnt(WEEK_ORDER)],["qd","ダンジョン",cnt(QD_ORDER)],["ur","ウルトラレア",cnt(UR_ORDER)]];
  if(!CATS.some(c=>c[0]===dexCat)) dexCat="main";
  let h = `<h2 class="sec-h">モンスターずかん</h2><p class="dexcount">つかまえた ${caught}・見つけた ${seen}・ぜんぶで ${DEX_ORDER.length}</p>`;
  h += `<div class="dexcats">${CATS.map(([k,n,c])=>`<button class="${dexCat===k?'on':''}" data-cat="${k}">${n}<small>${c}</small></button>`).join("")}</div>`;
  if(dexSel && save.seen[dexSel]){
    const s=SP[dexSel], own=save.owned[dexSel];
    h += `<div class="dexpop" id="dexpop"><div class="card detail"><button class="dexclose" id="dexclose" aria-label="とじる">×</button><div class="row"><div class="mon">${(own?artMine(dexSel):art(dexSel,1,{sil:true}))}</div><div style="min-width:0"><span class="mini">${s.umega?'ウルトラメガモンスター':s.week?`${WDAY[s.day]}曜日のモンスター`:s.ur?'ウルトラレアモンスター':s.mega?'メガモンスター（'+esc(megaWhere(dexSel))+'を克服）':s.qd?'クイズダンジョンの伝説のドラゴン':s.egg?'たまごから生まれるモンスター':s.rare?`${MAPD[s.pref][0]}のレアモンスター`:`No.${String(DEX_ORDER.indexOf(dexSel)+1).padStart(3,"0")}`}</span><h3>${esc(own?nameOf(dexSel):s.forms[0].n)}</h3>${typesChip(dexSel)}</div></div>
      <p>${own?esc(s.dex):'まだつかまえていない。つかまえると、くわしいことがわかるよ。'}</p>${own&&s.forms.length>1?`<p class="mini">しんか：${s.forms.map(f=>f.n+(f.lv?`（Lv.${f.lv}）`:'')).join(" → ")}</p>`:''}</div></div></div>`;
  }
  if(dexCat==="main"){
  const GRPS = [["start","さいしょの4体",Object.keys(STARTERS)], ...UNITS.slice().sort((x,y)=>(x.subject>y.subject?1:x.subject<y.subject?-1:x.no-y.no)).map(u=>[u.id, unitLabel(u), DEX_ORDER.filter(id=>u.monsters[id])])];
  if(!GRPS.some(g=>g[0]===dexGrp)) dexGrp="start";
  h += `<div class="dexgrps">${GRPS.map(([k,n,ids])=>`<button class="${dexGrp===k?'on':''}" data-grp="${k}">${esc(n)}<small>${cnt(ids)}</small></button>`).join("")}</div>`;
  const G = GRPS.find(g=>g[0]===dexGrp), U = UNITS.find(u=>u.id===dexGrp);
  if(U) h += `<p class="dexcount">${esc(unitLabel(U))}「${esc(U.title)}」のモンスター</p>`;
  h += `<div class="grid3 dexgrid">${G[2].map(id=>{ const i=DEX_ORDER.indexOf(id);
    const no = `No.${String(i+1).padStart(3,"0")}`;
    if(!save.seen[id]) return `<div class="card mcard unseen"><span class="no">${no}</span><div class="mon">？</div><b>？？？</b></div>`;
    const own = save.owned[id];
    return `<button class="card mcard" data-id="${id}"><span class="no">${no}</span><div class="mon">${(own?artMine(id):art(id,1,{sil:true}))}</div><b>${esc(own?nameOf(id):SP[id].forms[0].n)}</b>${own?typesChip(id):'<span class="mini">見つけた</span>'}</button>`;
  }).join("")}</div>`;
  }
  if(dexCat==="ur") h += `<h2 class="sec-h" style="margin-top:14px">ウルトラレア</h2><p class="dexcount">算数4「ぶんすうの城」の分数カードを全部★3にすると…</p><div class="grid3 dexgrid">${UR_ORDER.map(id=>save.owned[id]?`<button class="card mcard urcell" data-id="${id}"><span class="no">ウルトラレア</span><div class="mon">${artMine(id)}</div><b>${esc(nameOf(id))}</b>${typesChip(id)}</button>`:`<div class="card mcard unseen"><span class="no">ウルトラレア</span><div class="mon">${art(id,1,{sil:true})}</div><b>？？？</b></div>`).join("")}</div>`;
  const uc = UMEGA_ORDER.filter(id=>save.owned[id]).length, wc = WEEK_ORDER.filter(id=>save.owned[id]).length;
  if(dexCat==="umega") h += `<h2 class="sec-h" style="margin-top:14px">ウルトラメガモンスター</h2><p class="dexcount">なかまにした ${uc} / ${UMEGA_ORDER.length}　（単元のルートとでんせつを全部クリアして、ニガテの森を0問にすると手に入る）</p><div class="grid3 dexgrid">${UMEGA_ORDER.map(id=>{ const lb=unitLabel(UNITS.find(u=>u.id===UMEGA[id].unit));
    return save.owned[id]?`<button class="card mcard urcell" data-id="${id}"><span class="no">${esc(lb)}</span><div class="mon">${artMine(id)}</div><b>${esc(nameOf(id))}</b>${typesChip(id)}</button>`:`<div class="card mcard unseen"><span class="no">${esc(lb)}</span><div class="mon">${art(id,1,{sil:true})}</div><b>？？？</b></div>`; }).join("")}</div>`;
  if(dexCat==="week") h += `<h2 class="sec-h" style="margin-top:14px">曜日のモンスター</h2><p class="dexcount">なかまにした ${wc} / 7　（その曜日だけ、ぼうけん・ダンジョンで出やすい）</p><div class="grid3 dexgrid">${WEEK_ORDER.map(id=>{ const lb=WDAY[SP[id].day]+"曜日";
    if(save.owned[id]) return `<button class="card mcard rarecell" data-id="${id}"><span class="no">${lb}</span><div class="mon">${artMine(id)}</div><b>${esc(nameOf(id))}</b>${typesChip(id)}</button>`;
    if(save.seen[id]) return `<button class="card mcard" data-id="${id}"><span class="no">${lb}</span><div class="mon">${art(id,1,{sil:true})}</div><b>${esc(SP[id].forms[0].n)}</b><span class="mini">見つけた</span></button>`;
    return `<div class="card mcard unseen"><span class="no">${lb}</span><div class="mon">？</div><b>？？？</b></div>`; }).join("")}</div>`;
  const rc = RARE_ORDER.filter(id=>save.owned[id]).length;
  if(dexCat==="rare") h += `<h2 class="sec-h" style="margin-top:14px">都道府県のレアモンスター</h2><p class="dexcount">なかまにした ${rc} / 47　（「ちず」でその都道府県を「かんぜん」にすると手に入る）</p><div class="dexgrps">${RARE_AREAS.map(([n,a0,a1],i)=>`<button class="${dexArea===i?'on':''}" data-area="${i}">${n}<small>${RARE_ORDER.slice(a0,a1).filter(id=>save.owned[id]).length}/${a1-a0}</small></button>`).join("")}</div><div class="grid3 dexgrid">${RARE_ORDER.slice(RARE_AREAS[dexArea][1],RARE_AREAS[dexArea][2]).map(id=>{ const pn=MAPD[RARE[id].pref][0];
    if(!save.owned[id]) return `<div class="card mcard unseen"><span class="no">${pn}</span><div class="mon">${art(id,1,{sil:true})}</div><b>？？？</b></div>`;
    return `<button class="card mcard rarecell" data-id="${id}"><span class="no">${pn}</span><div class="mon">${artMine(id)}</div><b>${esc(nameOf(id))}</b>${typesChip(id)}</button>`; }).join("")}</div>`;
  const qc = QD_ORDER.filter(id=>save.owned[id]).length;
  if(dexCat==="qd") h += `<h2 class="sec-h" style="margin-top:14px">クイズダンジョンのモンスター</h2><p class="dexcount">なかまにした ${qc} / ${QD_ORDER.length}　（ドラゴン：フロアを全部マスター／たまご：毎日のたんけん）</p><div class="grid3 dexgrid">${QD_ORDER.map(id=>{ const lb=SP[id].qd?QD_FLOORS.find(f=>f.dragon===id).lb:'たまご';
    if(!save.owned[id]) return `<div class="card mcard unseen"><span class="no">${lb}</span><div class="mon">${art(id,1,{sil:true})}</div><b>？？？</b></div>`;
    return `<button class="card mcard ${SP[id].qd?'rarecell':''}" data-id="${id}"><span class="no">${lb}</span><div class="mon">${artMine(id)}</div><b>${esc(nameOf(id))}</b>${typesChip(id)}</button>`; }).join("")}</div>`;
  const mc = MEGA_ORDER.filter(id=>save.owned[id]).length;
  if(dexCat==="mega") h += `<h2 class="sec-h" style="margin-top:14px">メガモンスター</h2><p class="dexcount">なかまにした ${mc} / ${MEGA_ORDER.length}　（ニガテの森・ダンジョンのニガテを克服すると手に入る）</p><div class="grid3 dexgrid">${MEGA_ORDER.map(id=>{ const w=MEGA[id].where, lb=w.unit?((u=>u.label||(u.subject+"第"+u.no+"回"))(UNITS.find(u=>u.id===w.unit))):("ダンジョン"+QD_FLOORS.find(f=>f.id===w.floor).lb);
    if(!save.owned[id]) return `<div class="card mcard unseen"><span class="no">${lb}</span><div class="mon">${art(id,1,{sil:true})}</div><b>？？？</b></div>`;
    return `<button class="card mcard rarecell" data-id="${id}"><span class="no">${lb}</span><div class="mon">${artMine(id)}</div><b>${esc(nameOf(id))}</b>${typesChip(id)}</button>`; }).join("")}</div>`;
  const y = window.scrollY;
  app.innerHTML = h; window.scrollTo(0, y);
  app.querySelectorAll(".mcard[data-id]").forEach(b=>b.onclick=()=>{ dexSel=b.dataset.id; showDex(); });
  app.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ dexCat=b.dataset.cat; dexSel=null; showDex(); window.scrollTo(0,0); });
  app.querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>{ dexArea=+b.dataset.area; dexSel=null; showDex(); });
  app.querySelectorAll("[data-grp]").forEach(b=>b.onclick=()=>{ dexGrp=b.dataset.grp; dexSel=null; showDex(); });
  const pop=document.getElementById("dexpop"); if(pop){ const close=()=>{ dexSel=null; showDex(); }; document.getElementById("dexclose").onclick=close; pop.onclick=e=>{ if(e.target===pop) close(); }; }

function towerNext(){
  const keys=Object.entries(qdS().m).filter(([k,r])=>r.lv>=3 && QD_Q[k]).map(([k])=>k);
  const recent=B?B.recent:[]; let k, g=0; do{ k=pick(keys); }while(recent.includes(k) && g++<30);
  if(B){ B.recent.push(k); if(B.recent.length>15) B.recent.shift(); }

function startQD(fid, mode){
  showTabs(false);
  const s=qdS(), t=today(); let queue=[], name, pool, lvBase, f=QD_FLOORS.find(x=>x.id===fid);
  const mk = info => ({q:qdMakeQ(info, qdFmt(info, qdLv(info.key))), key:info.key});
  if(mode==="new"){ queue=f.qs.filter(q=>!s.m[q.key]).slice(0,10).map(mk); name="未知のへや"; lvBase=3; }
  if(mode==="review"){ queue=f.qs.filter(q=>{const r=s.m[q.key]; return r&&r.lv<5&&r.due<=t;}).sort((a,b)=>s.m[a.key].lv-s.m[b.key].lv || (s.m[a.key].due<s.m[b.key].due?-1:1)).slice(0,15).map(mk); name="ふくしゅうの間"; lvBase=6; }

    const rest=shuffle(f.qs.filter(q=>!weak.includes(q))).sort((a,b)=>qdLv(a.key)-qdLv(b.key));
    queue=shuffle([...weak,...rest].slice(0,10)).map(mk); name="ボス・弱点問題"; lvBase=16;

/* ============================================================
   ウルトラメガモンスター（v31）
   - ぼうけんの単元ごとに1ぴき（ダンジョンはふくまない）
   - その単元のルートを全部＋でんせつをクリアし、ニガテの森の「のこり」が0問になったらなかまに
     （一度もまちがえなかった場合も、全部クリアした時点でなかまに）
   - メガ（とちゅうでも取れる）とは別。メガはそのまま
   id: umega_<でんせつのid>（変更しない）
   ============================================================ */
const UMEGA = {};
for(const u of UNITS) if(u.legend && SP[u.legend]){ const b=SP[u.legend];
  UMEGA["umega_"+u.legend] = {arch:b.arch, body:b.body, beak:b.beak, numMark:b.numMark, type:b.type, type2:b.type2, color:b.color, accent:"#ffcf3a", skill:b.skill, legend:true, umega:true, src:u.legend, unit:u.id,
    parts:Object.assign({}, b.parts||{}, {horn:"crown", pat:"stars", wing:"crystal", acc:"gem", accColor:"#3dd6ff"}),
    forms:[{n:"ウルトラメガ"+b.forms[0].n}],
    dex:`${b.forms[0].n}が、単元のルートとでんせつをすべてクリアし、ニガテを1つ残らずなくした力でたどりついた究極の姿。`}; }
Object.assign(SP, UMEGA);
const UMEGA_ORDER = Object.keys(UMEGA);
const unitLabel = u => u.label||`${u.subject}第${u.no}回`;
function umegaProgress(id){
  const u=UNITS.find(x=>x.id===UMEGA[id].unit), done=u.stages.filter(s=>save.cleared[u.id+"|"+s.id]).length, boss=!!save.cleared[u.id+"|boss"];
  const now=Object.keys(save.wrong).filter(k=>k.startsWith(u.id+"|")).length;
  return {u, done, total:u.stages.length, boss, now, ok: done===u.stages.length && boss && now===0};
}
function grantUMegas(){
  const got=[];
  for(const id of UMEGA_ORDER){ if(save.owned[id]) continue;
    if(umegaProgress(id).ok){ save.owned[id]={lv:35,exp:0,form:0}; save.seen[id]=1; if(save.party.length<3) save.party.push(id); got.push(id); } }
  if(got.length) persist();
  return got;
}
const umegaCard = id => `<div class="card get evo umegacard"><div class="mon">${artMine(id)}</div><div><b>ウルトラメガ！ ${esc(nameOf(id))}</b><span>${esc(unitLabel(UNITS.find(u=>u.id===UMEGA[id].unit)))}「${esc(UNITS.find(u=>u.id===UMEGA[id].unit).title)}」を全部クリアして、ニガテを0にした！</span></div></div>`;
function umegaNote(u){
  const id="umega_"+u.legend; if(!UMEGA[id]) return "";
  if(save.owned[id]) return `<div class="card umegaline"><div class="mon">${artMine(id)}</div><div><b>${esc(nameOf(id))}</b><span class="mini">ウルトラメガモンスターがなかまになった！</span></div></div>`;
  const p=umegaProgress(id);
  const steps=[`ルート ${p.done}/${p.total}`, `でんせつ ${p.boss?'クリア':'まだ'}`, `ニガテのこり ${p.now}問`];
  return `<div class="card umegaline"><div class="mon">${art(id,1,{sil:true})}</div><div><b>ウルトラメガモンスター</b><span class="mini">ルートとでんせつを全部クリアして、ニガテの森を0問にするとなかまになる<br>${steps.join("・")}</span></div></div>`;
}

/* ============================================================
   たいりょく（HP）とわざ（v31）
   - ふつうのバトル・ダンジョン（無限の塔いがい）は、ハートのかわりに「なかまのHP」で戦う
     まちがえると先頭のなかまがダメージ → 0になると次のなかまにこうたい → 全員たおれると負け
     最大HP = 24 + Lv×4。HPはバトルごとにまんたんから。無限の塔はハート3のまま
   - わざ：正解したら、おぼえているわざ（4つまで）からえらんでこうげき
     タイプごとに Lv3・Lv8・Lv15 でおぼえる。つよいわざはコンボが必要
     でんせつ・メガ・ウルトラメガ・ウルトラレア・曜日のモンスターは専用のわざをもつ
   ============================================================ */
const MOVES = {
  tackle:{n:"たいあたり", t:null, pow:1.0, lv:1},
  mizu1:{n:"みずでっぽう", t:"mizu", pow:1.3, lv:3},

  hono1:{n:"ひのこ", t:"hono", pow:1.3, lv:3},
  hono2:{n:"ほのおのキバ", t:"hono", pow:1.0, lv:8, eff:"catch"},
  hono3:{n:"だいもんじ", t:"hono", pow:2.2, lv:15, combo:3},
  kusa1:{n:"はっぱカッター", t:"kusa", pow:1.3, lv:3},
  kusa2:{n:"やどりぎのタネ", t:"kusa", pow:1.0, lv:8, eff:"heal"},

  denki3:{n:"かみなり", t:"denki", pow:2.2, lv:15, combo:3},
  koori1:{n:"こおりのつぶて", t:"koori", pow:1.3, lv:3},
  koori2:{n:"こおりのかべ", t:"koori", pow:1.0, lv:8, eff:"guard"},
  koori3:{n:"ふぶき", t:"koori", pow:2.2, lv:15, combo:3},
  kaze1:{n:"かぜおこし", t:"kaze", pow:1.3, lv:3},
  kaze2:{n:"おいかぜ", t:"kaze", pow:1.0, lv:8, eff:"heal"},
  kaze3:{n:"たつまき", t:"kaze", pow:2.2, lv:15, combo:3},
  hikari1:{n:"フラッシュ", t:"hikari", pow:1.3, lv:3},
  hikari2:{n:"いやしのひかり", t:"hikari", pow:1.0, lv:8, eff:"heal"},
  hikari3:{n:"プリズムレーザー", t:"hikari", pow:2.2, lv:15, combo:3},
  sig_legend:{n:"でんせつのいぶき", sig:true, pow:1.8, combo:2},
  sig_mega:{n:"メガバースト", sig:true, pow:2.5, combo:2},
  sig_umega:{n:"ウルトラメガバースト", sig:true, pow:3.0, combo:2},
  sig_ur:{n:"ぶんすうスパーク", sig:true, pow:3.0, combo:2},
  sig_week:{n:"ようびパワー", sig:true, pow:1.5, eff:"week"}
};
const EFF = {heal:"HPも回復", catch:"フラスコが入りやすく", guard:"次のダメージ半分", week:"その曜日は2倍"};
function sigOf(id){ const s=SP[id]; return s.umega?"sig_umega":s.mega?"sig_mega":s.ur?"sig_ur":s.week?"sig_week":s.legend?"sig_legend":null; }
function learnSet(id){ const s=SP[id], a=[["tackle",1],[s.type+"1",3],[s.type+"2",8],[s.type+"3",15]];
  if(s.type2 && s.type2!==s.type) a.push([s.type2+"1",5],[s.type2+"2",11],[s.type2+"3",18]);
  return a.sort((x,y)=>x[1]-y[1]); }
function learnable(id){ return learnSet(id).map(x=>x[0]); }
function learnLv(id,k){ const e=learnSet(id).find(x=>x[0]===k); return e?e[1]:(MOVES[k].lv||0); }
function movesOf(id){
  const lv=(save.owned[id]||{}).lv||1, sig=sigOf(id), learn=learnable(id).filter(k=>learnLv(id,k)<=lv);
  const o=save.owned[id]||{}, tm=o.tm, sm=o.sm, top=[sig, tm&&MOVES[tm]?tm:null, sm&&MOVES[sm]&&smS()[sm.slice(3)]?sm:null].filter(Boolean);
  return [...top, ...learn.slice(-(4-top.length))];
}
function moveType(id,k){ const M=MOVES[k]; return M.t || (M.sig ? SP[id].type : null); }
function moveInfo(id,k){ const M=MOVES[k], t=moveType(id,k), up=((save.owned[id]||{}).mvUp||{})[k]||0; return `${M.special?'とくべつ・':''}${t?TYPES[t]:'ふつう'}・いりょく${Math.round(M.pow*10*(1+up*.1))}${up?`（+${up}）`:''}${M.combo?`・${M.combo}コンボ`:''}${M.eff?'・'+EFF[M.eff]:''}`; }
/* 色ちがい（v36）: 野生でまれに出る（SHINY_RATE）。Lv+5・HP1.5倍・たおすとEXP2倍。でんせつ戦・トレーナー戦では出ない
   つかまえると owned.shiny と owned.shinyWild。本物の色ちがい（shinyWild）は こうげき・最大HP 1.2倍（ひかるインクの色ちがいは見た目だけ） */
const SHINY_RATE = 1/30;
const shinyPow = id => (save.owned[id]||{}).shinyWild ? 1.2 : 1;
const maxHPOf = id => Math.round((24 + ((save.owned[id]||{}).lv||1)*4) * shinyPow(id));
const useHP = () => !!B && !B.tower;
function hpOf(id){ B.hp=B.hp||{}; if(B.hp[id]==null) B.hp[id]=maxHPOf(id); return Math.min(B.hp[id], maxHPOf(id)); }
function aliveIds(){ return save.party.filter(id=>save.owned[id] && hpOf(id)>0); }
/* v39: こうげきの威力にばらつき。きゅうしょ（1/8、1.5倍）・かすった（1/10、0.5倍）・ふつうは 0.85〜1.15倍 */
function dmgRoll(){ const r=Math.random(); if(r<.125) return {k:1.5, t:"crit"}; if(r<.225) return {k:.5, t:"graze"}; return {k:.85+Math.random()*.3, t:""}; }
const rollText = t => t==="crit"?'<b class="hasty">きゅうしょにあたった！</b> ':t==="graze"?'かすっただけ… ':'';
function hurtLead(x=1){
  const me=B.lead, w=B.wild, mm=defMult(SP[w.id].type, me), dm=mm===2?1.5:mm===.5?.7:1;
  const rl=dmgRoll(); let d=Math.max(2, Math.round((5+w.lv*0.8)*dm*rl.k))*x, guarded=false;
  if(B.guard){ d=Math.ceil(d/2); B.guard=false; guarded=true; }
  B.hp[me]=Math.max(0, hpOf(me)-d);
  return {d, mm, guarded, roll:rl.t};
}
function healLead(r){ const me=B.lead, mx=maxHPOf(me), before=hpOf(me); B.hp[me]=Math.min(mx, before+Math.ceil(mx*r)); return B.hp[me]-before; }
function hpMiniHTML(){ return `<div class="ptm">${save.party.filter(id=>save.owned[id]).map(id=>{ const r=hpOf(id)/maxHPOf(id); return `<span class="${id===B.lead?'cur':''} ${r<=0?'down':''}"><span class="bar hpbar ${hpClass(r)}"><i style="width:${r*100}%"></i></span></span>`; }).join("")}</div>`; }

function updMyHP(){ const b=document.getElementById("mhp"), n=document.getElementById("mhpn"); if(!b) return; const h=hpOf(B.lead), mx=maxHPOf(B.lead), r=h/mx; b.className="bar hpbar "+hpClass(r); b.firstElementChild.style.width=(r*100)+"%"; if(n) n.textContent=`HP ${h}/${mx}`; }
function nextMoveText(id){ const lv=(save.owned[id]||{}).lv||1, nx=learnable(id).find(k=>learnLv(id,k)>lv); return nx?`<p class="mini">Lv.${learnLv(id,nx)}で「${MOVES[nx].n}」をおぼえる</p>`:''; }
/* 大きさ：種類ごとの大きさ（size か ARCH_SIZE）×個体ごとの大きさ（sz。出会うたびに 0.92〜1.08、ときどき でかい 1.22／ちびっこ 0.78） */
const sizeLabel = sz => sz>=1.2?'でかい！':sz<=.8?'ちびっこ':'';
function heightOf(id, sz, f){ return Math.max(.1, Math.round(.4*spSize(id,f)*[1,1.6,2.4][f]*(sz||1)*10)/10); }
function sizeText(id){ const o=save.owned[id]||{}, f=SP[id].legend?2:curF(id), lb=sizeLabel(o.sz||1); return `たかさ ${heightOf(id,o.sz,f)}m${lb?`（${lb}）`:''}`; }

/* ============================================================
   しっかり読んで答えるための工夫（v33、ユーザーの要望「こどもが適当に答えるので、もう少し真剣に答える工夫」）
   - 読むまで押せない: 問題が出てから readSecs 秒は答えの場所に「よく読んでから答えよう」のカバー（1.5〜6秒、問題文・ほそく・選択肢の長さで決まる）
   - あわてんぼう: 押せるようになってから FAST_MS 以内に答えてまちがえると、ダメージ2倍（塔はそのまま）
   - 1回目正解だけごほうび: まちがえたあとの正解は EXP 半分・コンボがふえない（フラスコもひろえない）
   - まちがえたら解説を読む時間: 「わかった！」が 2〜5秒押せない
   - きろく: save.alog = {日付:{a:回答, ng:まちがい, f:すぐ答えた, fng:すぐ答えてまちがい}}（60日分）。ぼうけん画面の下「おうちの人へ」
   ============================================================ */
const FAST_MS = 1200;
function readSecs(q){
  const c=(q.q||"").length + (q.note?q.note.length*.4:0) + (Array.isArray(q.c)?q.c.join("").length*.3:0) + (q.pairs?q.pairs.flat().join("").length*.3:0) + (q.table||q.graph||q.bars||q.map||q.img?8:0);
  return Math.min(6, Math.max(1.5, 1+c*.05));
}
function applyReadLock(item, q){
  if(!item.readUntil) item.readUntil = Date.now() + readSecs(q)*1000;
  const left = item.readUntil - Date.now(); if(left<=50 || B.busy) return;
  const qp=app.querySelector(".qpanel"), qt=app.querySelector(".qtext"), sub=document.getElementById("sub"); if(!qp||!qt) return;
  const d=document.createElement("div"); d.className="rlock";
  d.style.top=(qt.offsetTop+qt.offsetHeight)+"px"; d.style.bottom=(sub?Math.max(0,qp.offsetHeight-sub.offsetTop):0)+"px";
  d.innerHTML=`<span>よく読んでから答えよう</span><i><b style="animation-duration:${left}ms"></b></i>`;
  qp.appendChild(d); setTimeout(()=>d.remove(), left);
}
function logAnswer(ok, fast){
  const L=save.alog||(save.alog={}), t=today(), r=L[t]||(L[t]={a:0,ng:0,f:0,fng:0});
  r.a++; if(!ok) r.ng++; if(fast){ r.f++; if(!ok) r.fng++; }
  const ks=Object.keys(L).sort(); while(ks.length>60) delete L[ks.shift()];
}
function parentLogHTML(){
  const L=save.alog||{}, ks=Object.keys(L).sort().reverse().slice(0,14);
  const rows=ks.map(k=>{ const r=L[k], [y,m,d]=k.split("-"); const warn=r.a>=5 && r.fng/r.a>=.2;
    return `<tr><td>${+m}/${+d}</td><td>${r.a}</td><td>${r.ng}</td><td>${r.f}</td><td class="${warn?'warn':''}">${r.fng}</td></tr>`; }).join("");
  return `<details class="card plog" style="margin-top:14px;padding:10px 14px"><summary>おうちの人へ：こたえ方のきろく</summary>
    <p class="mini" style="margin:6px 0 0">「すぐ答えた」は、答えを押せるようになってから${FAST_MS/1000}秒以内に答えた回数です。そのうちまちがえた数が多い日（回答の2割以上）は赤く表示します。</p>

/* ---------- バトルタワー（トレーナー戦）：クリアしたルートの問題から出題。トレーナーのモンスター3びきをたおすと勝ち ---------- */
const TRAINERS = ["たんけんたいのソラ","りかクラブのミナ","ちずはかせのケン","けいさんマスターのユイ","かがくしゃのハル","れきしずきのゲン","ほしよみのルナ","いきものはかせのモリ","チャンピオンのアオイ"];
function seededRand(n){ let a=n*9973+7; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function trainerOf(r){
  const R=seededRand(r), nm = r<=TRAINERS.length ? TRAINERS[r-1] : `チャンピオンのアオイ（${r-TRAINERS.length+1}回目）`;
  const pool=DEX_ORDER.filter(id=>!SP[id].legend), legends=UNITS.map(u=>u.legend).filter(Boolean), team=[];
  while(team.length<3){ const id=pool[Math.floor(R()*pool.length)]; if(!team.includes(id)) team.push(id); }
  if(r>=5) team[2]=legends[Math.floor(R()*legends.length)];
  return {r, nm, team, lv:Math.min(MAX_LV, Math.max(4+r*3, partyRef()+Math.floor(r/2))), idx:0};
}
function trainerQs(){ const all=[]; for(const u of UNITS) u.stages.forEach(s=>{ if(save.cleared[u.id+"|"+s.id]) s.qs.forEach((q,i)=>all.push({q,key:qKey(u.id,s.id,i)})); }); return shuffle(all); }
function startTrainer(r){
  const qs=trainerQs(); if(qs.length<10) return;
  showTabs(false);
  const t=trainerOf(r);
  B = {colBefore:prefLevels(), u:{id:"tower"}, sid:"trainer", trainer:t, name:`バトルタワー ${r}人目`, queue:qs, total:qs.length, pool:t.team, lvBase:t.lv, hearts:MAX_HP, lead:save.party[0],
       wild:null, combo:0, maxCombo:0, mistakes:0, n:0, used:{}, power:false, luck:false,
       caught:[], defeated:0, evoReady:[], lvups:{}, ballsGot:0, busy:false, swapOpen:false, hp:{}, guard:false, lure:false, newMoves:[]};
  spawn(); renderBattle(true);
}
function finishTrainer(win){
  window.scrollTo(0,0);
  const t=B.trainer, bt=save.btower||(save.btower={best:0}); let reward=0;
  misMax("combo",B.maxCombo); if(win) misAdd("tower");
  if(win){ reward=3+t.r; save.balls+=reward; if(t.r>(bt.best||0)) bt.best=t.r; addExp(B.lead,15); }
  stat().maxCombo=Math.max(stat().maxCombo||0,B.maxCombo);
  persist();
  const gets=[...grantUMegas().map(umegaCard), rewardCards(), ...B.evoReady.map(id=>`<div class="card get evo"><div class="mon">${artMine(id)}</div><div><b>${esc(nameOf(id))} Lv.${save.owned[id].lv}</b><span>しんかできるようになった！</span></div></div>`)].join("");
  const ups=Object.entries(B.lvups).map(([id,lv])=>`${esc(nameOf(id))} Lv.${lv}`).join("・");
  app.innerHTML=`<div class="result"><p class="line">バトルタワー ${t.r}人目</p><h2>${win?`${esc(t.nm)}に勝った！`:'目の前がまっくらになった…'}</h2>
    <p class="line">${win?`フラスコ +${reward}・`:''}まちがい ${B.mistakes}回・さいだい ${B.maxCombo}コンボ</p>${ups?`<p class="line">レベルアップ：${ups}</p>`:''}${newMovesHTML()}
    <div class="gets">${gets}</div>
    ${win?`<button class="btn go" id="nx">つぎのトレーナー（${t.r+1}人目）へ</button>`:`<button class="btn go" id="rt">もう一度いどむ</button>`}
    <button class="btn alt" id="bk">ひろばにもどる</button></div>`;
  const r=t.r;
  const g=id=>document.getElementById(id);
  if(g("nx")) g("nx").onclick=()=>{ B=null; startTrainer(r+1); };
  if(g("rt")) g("rt").onclick=()=>{ B=null; startTrainer(r); };
  g("bk").onclick=()=>{ B=null; tab="plaza"; home(); };
}

/* ============================================================
   都道府県あてゲーム（v41、「ちず」タブのミニゲーム）
   ユーザーの要望「地図と都道府県の形を当てるゲームも追加して欲しい」

   - 1回10問（地方は7〜9県なので全部）。正解2問ごとにフラスコ+1、全問正解でさらに+3。地図の色（prefScores）には関係しない
   - 記録 save.pg = {best:{"mode|area":{ok,t}}, perfect:{mode:1}}（全国で全問正解）
   ============================================================ */
const PREF_ORDER = RARE_ORDER.map(id=>id.slice(5));
const CAPITAL = {hokkaido:"札幌市",aomori:"青森市",iwate:"盛岡市",miyagi:"仙台市",akita:"秋田市",yamagata:"山形市",fukushima:"福島市",ibaraki:"水戸市",tochigi:"宇都宮市",gunma:"前橋市",saitama:"さいたま市",chiba:"千葉市",tokyo:"東京（新宿区）",kanagawa:"横浜市",
  niigata:"新潟市",toyama:"富山市",ishikawa:"金沢市",fukui:"福井市",yamanashi:"甲府市",nagano:"長野市",gifu:"岐阜市",shizuoka:"静岡市",aichi:"名古屋市",mie:"津市",shiga:"大津市",kyoto:"京都市",osaka:"大阪市",hyogo:"神戸市",nara:"奈良市",wakayama:"和歌山市",
  tottori:"鳥取市",shimane:"松江市",okayama:"岡山市",hiroshima:"広島市",yamaguchi:"山口市",tokushima:"徳島市",kagawa:"高松市",ehime:"松山市",kochi:"高知市",fukuoka:"福岡市",saga:"佐賀市",nagasaki:"長崎市",kumamoto:"熊本市",oita:"大分市",miyazaki:"宮崎市",kagoshima:"鹿児島市",okinawa:"那覇市"};
const PG_MODES = [["shape","形から名前","都道府県の形を見て、名前をえらぶ"],["tap","名前から地図","都道府県の場所を地図でタップ"],["cap","県庁所在地","光っている都道府県の県庁所在地をえらぶ"]];
const PG_AREAS = [...RARE_AREAS.map(([n,a,b])=>[n,PREF_ORDER.slice(a,b)]), ["全国",PREF_ORDER]];
const pgS = () => save.pg || (save.pg = {best:{}, perfect:{}});
let PG = null, pgMode = "shape", pgArea = 6;
function prefShapeSVG(id){ const [x,y,w,h]=MAPB[id], p=Math.max(w,h)*.08, sw=(Math.max(w,h)/120).toFixed(2);
  return `<svg class="pgshape" viewBox="${(x-p).toFixed(1)} ${(y-p).toFixed(1)} ${(w+2*p).toFixed(1)} ${(h+2*p).toFixed(1)}" role="img" aria-label="都道府県の形"><path d="${MAPD[id][1]}" fill="#7ec8a0" stroke="#24324a" stroke-width="${sw}" stroke-linejoin="round"/></svg>`; }
function pgEntryHTML(){
  const s=pgS(), b=s.best[pgMode+"|"+pgArea];
  return `<div class="card pgcard"><b class="pgtitle">都道府県あてゲーム</b>
    <div class="dexcats" style="margin:6px 0 4px">${PG_MODES.map(([k,n])=>`<button class="${pgMode===k?'on':''}" data-pgm="${k}">${n}</button>`).join("")}</div>
    <div class="dexgrps">${PG_AREAS.map(([n],i)=>`<button class="${pgArea===i?'on':''}" data-pga="${i}">${n}</button>`).join("")}</div>
    <p class="mini" style="margin:2px 0 8px">${PG_MODES.find(m=>m[0]===pgMode)[2]}。${pgArea===6?'47都道府県から10問':`${PG_AREAS[pgArea][0]}の${PG_AREAS[pgArea][1].length}問`}・正解2問ごとにフラスコ+1${b?`<br>さいこう記録：${b.ok}問正解・${(b.t/1000).toFixed(1)}秒`:''}</p>
    <button class="btn go" id="pgstart">スタート！</button></div>`; }
function bindPgEntry(){ app.querySelectorAll("[data-pgm]").forEach(b=>b.onclick=()=>{ pgMode=b.dataset.pgm; showJMap(); });
  app.querySelectorAll("[data-pga]").forEach(b=>b.onclick=()=>{ pgArea=+b.dataset.pga; showJMap(); });
  const st=document.getElementById("pgstart"); if(st) st.onclick=()=>startPG(pgMode, pgArea); }
function startPG(mode, area){
  const pool=PG_AREAS[area][1], qs=shuffle(pool).slice(0,10);
  PG={mode, area, qs, i:0, ok:0, t0:Date.now(), miss:[]}; showTabs(false); renderPG(); }
function pgChoices(id, f){ const area=PG_AREAS[PG.area][1], near=shuffle((area.length>=4?area:PREF_ORDER).filter(x=>x!==id)).slice(0,3); return shuffle([id,...near]).map(x=>({id:x, t:f(x)})); }
function renderPG(){
  window.scrollTo(0,0);
  const id=PG.qs[PG.i], n=PG.qs.length, m=PG.mode, area=PG_AREAS[PG.area][1];
  let body="";
  if(m==="shape"){ PG.ch=pgChoices(id, x=>MAPD[x][0]); body=`<p class="qtext">この形の都道府県はどこ？</p><div class="pgbox">${prefShapeSVG(id)}</div><div class="choices">${PG.ch.map((c,j)=>`<button class="choice" data-j="${j}"><span class="k">${KANA[j]}</span>${esc(c.t)}</button>`).join("")}</div>`; }
  if(m==="cap"){ PG.ch=pgChoices(id, x=>CAPITAL[x]); body=`<p class="qtext">光っている都道府県の県庁所在地は？</p><div class="qmap">${mapSVG({view:PG_AREAS.slice(0,6).find(a=>a[1].includes(id))[1], fill:{[id]:"#ffcf3a"}})}${MAPCREDIT}</div><div class="choices">${PG.ch.map((c,j)=>`<button class="choice" data-j="${j}"><span class="k">${KANA[j]}</span>${esc(c.t)}</button>`).join("")}</div>`; }
  if(m==="tap"){ body=`<p class="qtext"><b>${MAPD[id][0]}</b>はどこ？ 地図をタップしよう</p><div class="qmap big">${mapSVG({view:PG.area===6?null:area, tap:true})}${MAPCREDIT}</div>`; }
  app.innerHTML=`<div class="btop"><button class="back" id="pgback">← やめる</button><span class="pill">${PG.i+1} / ${n}問</span><span class="pill">正解 ${PG.ok}</span><span class="pill" id="pgtime">0.0秒</span></div>
    <div class="card qpanel"><div class="qmeta"><span>都道府県あて・${PG_MODES.find(x=>x[0]===m)[1]}</span><span>${PG_AREAS[PG.area][0]}</span></div>${body}<div id="pgfb"></div></div>`;
  document.getElementById("pgback").onclick=()=>{ PG=null; clearInterval(pgTimer); tab="map"; home(); };
  clearInterval(pgTimer); pgTimer=setInterval(()=>{ const e=document.getElementById("pgtime"); if(!e||!PG){ clearInterval(pgTimer); return; } e.textContent=((Date.now()-PG.t0)/1000).toFixed(1)+"秒"; },100);
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pgJudge(PG.ch[+b.dataset.j].id, b));
  app.querySelectorAll(".qmap path.tp").forEach(p=>p.onclick=()=>pgJudge(p.dataset.p, p));
}
let pgTimer=null;
function pgJudge(ans, el){
  if(PG.lock) return; PG.lock=true;
  const id=PG.qs[PG.i], ok=ans===id;
  if(ok) PG.ok++; else PG.miss.push(id);
  logAnswer(ok, false);
  app.querySelectorAll(".choice").forEach(b=>{ b.disabled=true; const c=PG.ch[+b.dataset.j]; if(c.id===id) b.classList.add("ok"); else if(c.id===ans) b.classList.add("ng"); });
  if(PG.mode==="tap"){ const pa=app.querySelector(`.qmap path[data-p="${id}"]`); if(pa) pa.setAttribute("fill","#7ed9a6"); if(!ok){ const pw=app.querySelector(`.qmap path[data-p="${ans}"]`); if(pw) pw.setAttribute("fill","#ff9aa8"); } }
  const last=PG.i+1>=PG.qs.length;
  document.getElementById("pgfb").innerHTML=`<div class="fb ${ok?'ok':'ng'}"><h3>${ok?'せいかい！':'ざんねん…'}</h3><p>${PG.mode==="tap"&&!ok?`タップしたのは ${MAPD[ans]?MAPD[ans][0]:''}。`:''}<b>${MAPD[id][0]}</b>（県庁所在地：${CAPITAL[id]}）</p></div><button class="btn ${ok?'go':''}" id="pgnext" style="margin-top:12px">${last?'けっかを見る':'つぎへ'}</button>`;
  document.getElementById("pgnext").onclick=()=>{ PG.lock=false; PG.i++; if(last) return finishPG(); renderPG(); };
  document.getElementById("pgfb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function finishPG(){
  clearInterval(pgTimer); window.scrollTo(0,0);
  const t=Date.now()-PG.t0, n=PG.qs.length, all=PG.ok===n, s=pgS(), key=PG.mode+"|"+PG.area, b=s.best[key];
  const rec = !b || PG.ok>b.ok || (PG.ok===b.ok && t<b.t); if(rec) s.best[key]={ok:PG.ok, t};
  if(all && PG.area===6) s.perfect[PG.mode]=1;
  const fl=Math.floor(PG.ok/2)+(all?3:0); save.balls+=fl; misAdd("pg", PG.ok); persist();
  const gets=rewardCards();
  const mode=PG.mode, area=PG.area;
  app.innerHTML=`<div class="result"><p class="line">都道府県あて・${PG_MODES.find(x=>x[0]===mode)[1]}（${PG_AREAS[area][0]}）</p><h2>${all?'全問正解！':`${PG.ok} / ${n}問 正解`}</h2>
    <p class="line">タイム ${(t/1000).toFixed(1)}秒${rec?'・<b>さいこう記録！</b>':''}・フラスコ +${fl}</p>
    ${PG.miss.length?`<div class="card" style="padding:8px 12px;margin:10px 0;text-align:left"><b>まちがえた都道府県</b><div class="pgmiss">${PG.miss.map(id=>`<div><div class="pgmini">${prefShapeSVG(id)}</div><span>${MAPD[id][0]}<br><small>${CAPITAL[id]}</small></span></div>`).join("")}</div></div>`:''}
    <div class="gets">${gets}</div>
    <button class="btn go" id="pgagain">もう一度</button><button class="btn alt" id="pgmap">ちずにもどる</button></div>`;
  PG=null;
  document.getElementById("pgagain").onclick=()=>startPG(mode, area);
  document.getElementById("pgmap").onclick=()=>{ tab="map"; home(); };
}

/* ---------- battle ---------- */
let B = null;
function startBattle(uid, sid){
  showTabs(false);
  const u = UNITS.find(x=>x.id===uid);
  let queue, pool, name, lvBase, sIdx = u.stages.findIndex(x=>x.id===sid);
  if(sid==="boss"){
    const all=[]; u.stages.forEach(s=>s.qs.forEach((q,i)=>all.push({q,key:qKey(u.id,s.id,i)})));
    queue = shuffle(all).slice(0,10); pool=[u.legend]; name="でんせつのすみか"; lvBase=14;
  }else if(sid==="review"){
    queue=[]; u.stages.forEach(s=>s.qs.forEach((q,i)=>{const k=qKey(u.id,s.id,i); if(save.wrong[k]) queue.push({q,key:k});}));
    pool = Object.keys(u.monsters).filter(k=>k!==u.legend); name="ニガテの森"; lvBase=4;
  }else{
    const s=u.stages[sIdx];
    queue = s.qs.map((q,i)=>({q,key:qKey(u.id,s.id,i)})); pool=s.wild; name=s.name; lvBase=2+sIdx*2;

  let qmsg="";
  if(B.qd){ const lb=qdLv(item.key); qmsg=qdMark(item, ok); const la=qdLv(item.key); if(la>lb) B.ups++; if(la>=5&&lb<5) B.mastered++; }
  const qm = qmsg?`<p class="mini"><b>${esc(qmsg)}</b></p>`:"";
  if(ok && B.tower){

    persist();
    const wm=document.getElementById("wildMon"), mm=document.getElementById("meMon"); mm.classList.add("lunge"); setTimeout(()=>{ wm.classList.add("hit"); setTimeout(()=>wm.classList.add("faint"),300); },250);
    setLog(`<b>${esc(nameOf(B.lead))}</b>のこうげき！ <b>${esc(nameOf(B.wild.id,B.wild.lv))}</b>をたおした！`);
    fb.innerHTML = `<div class="fb ok"><h3>せいかい！ ${B.tower.floor-1}階クリア</h3>${q.e?`<p>${esc(q.e)}</p>`:""}${bonus}</div><button class="btn go" id="next" style="margin-top:12px">${B.tower.floor}階へすすむ</button>`;
    document.getElementById("next").onclick=()=>{ B.busy=false; B.queue.push(towerNext()); B.lvBase=3+Math.floor(B.tower.floor/2); spawn(); renderBattle(true); };
    fb.scrollIntoView({behavior:"smooth",block:"nearest"});
    return;
  }
  if(ok){
    const first = !item.missed;

    if(first){ B.combo++; B.maxCombo=Math.max(B.maxCombo,B.combo); }
    let bonus = first ? "" : `<p class="mini">まちがえたあとの正解なので、ごほうびは少なめ（EXP半分・コンボはふえない）。1回で正解するとたくさんもらえるよ。</p>`;
    if(first && B.combo%3===0){ save.balls++; B.ballsGot++; bonus=`<p><b>${B.combo}コンボ！ フラスコを1つひろった！</b></p>`; }
    if(B.sid==="review") delete save.wrong[item.key];
    if(!B.qd) (save.okOnce=save.okOnce||{})[item.key]=1;
    if(!B.qd && q.f && !item.missed && fracMark(q.f)) B.fracUp=(B.fracUp||0)+1;
    B.queue.shift(); persist();
    addExp(B.lead, xp(first?6:3)); save.party.forEach(id=>{ if(id!==B.lead) addExp(id, xp(first?3:1)); });
    let firstMv=true;
    const mvh = movesOf(B.lead).map(k=>{ const M=MOVES[k], lock=!!M.combo&&B.combo<M.combo, {m}=dmgOf(k), t=moveType(B.lead,k);
