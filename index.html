<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>理科クエスト</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="理科クエスト">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7fcbff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: phone-first single column. Adventure tab = hillside hero + route cards; battle = grass field (wild top-right, partner bottom-left) above the question panel; bottom tab bar. */
:root{
  --sky:#7fcbff; --sky2:#dff3ff; --grass:#74c94f; --grass2:#4fa636; --bg:#eef8e6;
  --ink:#24324a; --muted:#5d6c86; --panel:#ffffff; --soft:#f3f8fc;
  --sun:#ffcf3a; --accent:#ff7a2f; --good:#24a865; --bad:#e8475a;
  --t-mizu:#3d8bff; --t-hono:#ff6a2b; --t-kusa:#34a853; --t-iwa:#a0784b;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky2) 0,var(--bg) 320px) var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-block:12px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.dsp{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.chip{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:999px;padding:0 8px;line-height:20px;white-space:nowrap}
.t-mizu{background:var(--t-mizu)}.t-hono{background:var(--t-hono)}.t-kusa{background:var(--t-kusa)}.t-iwa{background:var(--t-iwa)}
.bar{height:9px;background:#dfe6ee;border-radius:6px;overflow:hidden;border:2px solid var(--ink)}
.bar>i{display:block;height:100%;transition:width .45s}
.hpbar>i{background:var(--good)}.hpbar.mid>i{background:var(--sun)}.hpbar.low>i{background:var(--bad)}
.expbar>i{background:var(--t-mizu)}
.btn{display:block;width:100%;border:3px solid var(--ink);border-radius:14px;padding:11px 14px;font-family:var(--display);font-size:18px;box-shadow:0 4px 0 var(--ink);background:var(--sun)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45}
.btn.alt{background:var(--panel)}
.btn.go{background:var(--accent);color:#fff}
.mon svg{display:block;width:100%;height:100%;overflow:visible}

/* hero */
.hero{position:relative;overflow:hidden;border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 62%);padding:18px 18px 0;min-height:230px}
.hero .sun{position:absolute;right:22px;top:16px;width:54px;height:54px;border-radius:50%;background:var(--sun);border:3px solid var(--ink)}
.hero .hill{position:absolute;left:-10%;right:-10%;bottom:-70px;height:150px;background:var(--grass);border-top:3px solid var(--ink);border-radius:50% 50% 0 0}
.hero .hill2{position:absolute;right:-30%;width:80%;bottom:-40px;height:110px;background:var(--grass2);border-top:3px solid var(--ink);border-radius:50% 50% 0 0}
.hero h1{position:relative;font-size:38px;line-height:1.1;color:var(--ink)}
.hero p{position:relative;margin:4px 0 0;font-weight:800;font-size:13px;color:var(--muted)}
.hero .lead{position:absolute;left:18px;bottom:8px;width:104px;height:104px}
.hero .stats{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:1px 12px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:18px}

.subj{display:flex;margin-top:18px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.subj button{flex:1;border:none;background:var(--panel);font-family:var(--display);font-size:18px;padding:8px 0}
.subj button+button{border-left:3px solid var(--ink)}
.subj button.on{background:var(--sun)}
.qbars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;margin-top:6px;font-size:12.5px}
.qb-l{font-weight:800;white-space:nowrap}
.qb-t{height:12px;background:#fff;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.qb-t i{display:block;height:100%;background:#2f6fd6}
.qb-v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ordrow{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}
.ordrow .btn{font-size:16px;padding:9px 6px;white-space:nowrap}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mbtn{display:flex;align-items:center;gap:6px;text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--soft);padding:8px;font-size:14px;font-weight:500;min-height:48px;line-height:1.3;overflow-wrap:anywhere}
.mbtn .k{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;display:grid;place-items:center;font-weight:800}
.mbtn.cur{background:#fff4d6;border-width:3px}
.mbtn.R.ready{border-style:dashed}
.mbtn.ok{background:#dcf5e8;border-color:var(--good)}
.mbtn.ng{background:#ffe1e5;border-color:var(--bad)}
.regions{display:flex;gap:10px;overflow-x:auto;margin:18px -4px 0;padding:4px 4px 10px;scroll-snap-type:x mandatory}
.region{flex:0 0 72%;max-width:260px;scroll-snap-align:center;text-align:left;padding:10px 14px;display:flex;flex-direction:column;background:var(--soft);box-shadow:0 3px 0 var(--ink)}
.region.on{background:var(--grass);color:#fff}
.region .rno{font-size:11px;font-weight:800;opacity:.8}
.region b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.3}
.region .rsub{font-size:12px;font-weight:800;opacity:.85}
.unit{margin-top:22px}
.unit-head{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-bottom:10px}
.unit-no{white-space:nowrap;font-family:var(--display);font-size:13px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 8px}
.unit-head h2{font-size:21px}
.unit-head .sub{white-space:nowrap;margin-left:auto;font-size:12px;color:var(--muted);font-weight:800}
.routes{display:flex;flex-direction:column;gap:12px}
.route{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;width:100%;text-align:left;padding:10px 14px}
.route:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.route .rn{font-size:11px;font-weight:800;color:var(--grass2);letter-spacing:.08em}
.route b{display:block;font-family:var(--display);font-weight:400;font-size:17px;line-height:1.3}
.route .note{font-size:12px;color:var(--muted)}
.route .wilds{grid-column:1/-1;display:flex;gap:6px;margin-top:2px}
.route .wilds .mon{width:36px;height:36px;background:var(--soft);border-radius:50%;border:2px solid #d5dee8;padding:2px}
.stars{font-family:var(--display);color:var(--sun);-webkit-text-stroke:1px var(--ink);font-size:20px;letter-spacing:1px;white-space:nowrap}
.stars .off{color:#dfe6ee}
.route.boss{background:#fff4d6}
.route.review{background:#ffeef0;border-style:dashed}
.route[disabled]{opacity:.55}
.tools{text-align:center;margin-top:26px;font-size:12px;color:var(--muted)}
.tools button{background:none;border:none;text-decoration:underline;color:var(--muted);padding:6px}
.confirm{display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px}
.confirm button{border:2px solid var(--ink);background:var(--panel);border-radius:8px;padding:3px 12px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:3px solid var(--ink);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs[hidden]{display:none}
.tabs button{flex:1;max-width:130px;background:none;border:none;padding:8px 0 6px;font-weight:800;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--ink)}
.tabs button.on svg{transform:translateY(-2px)}

/* starter */
.prof{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px}
.prof.gift{width:100%;background:#fff4d6;animation:enter .5s}
.prof .face{flex:none;width:52px;height:52px}
.prof p{margin:0;font-weight:800}
.starters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.starter{padding:10px 6px;text-align:center}
.starter .mon{width:84px;height:84px;margin:0 auto}
.starter b{display:block;font-family:var(--display);font-weight:400;font-size:15px}
.starter.sel{background:#fff4d6;transform:translateY(-4px)}
.skilltxt{font-size:12px;color:var(--muted);line-height:1.4}

/* battle */
.btop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.back{border:2px solid var(--ink);background:var(--panel);border-radius:10px;padding:2px 10px;font-size:13px;font-weight:800}
.hearts{display:flex;gap:2px;margin-left:auto}
.hearts svg{width:20px;height:20px}
.field{position:relative;height:250px;overflow:hidden;border:3px solid var(--ink);border-radius:18px;background:linear-gradient(180deg,var(--sky) 0,var(--sky2) 58%,var(--grass) 58%,var(--grass2) 100%)}
.field .plat{position:absolute;border-radius:50%;background:#8fd86a;border:3px solid var(--ink)}
.plat.w{right:14px;top:96px;width:150px;height:34px}
.plat.m{left:6px;bottom:18px;width:160px;height:36px}
.field .mon{position:absolute;transition:transform .3s,opacity .3s}
#wildMon{right:30px;top:12px;width:118px;height:118px}
#meMon{left:22px;bottom:30px;width:128px;height:128px}
#meMon svg{transform:scaleX(-1)}
.info{position:absolute;background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:4px 10px 6px;width:168px}
.info .nm{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px;line-height:1.4}
.info .nm .lv{margin-left:auto;font-variant-numeric:tabular-nums}
.info .nums{font-size:11px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.info.w{left:10px;top:10px}
.info.m{right:10px;bottom:12px}
.flask{position:absolute;width:30px;height:36px;left:90px;bottom:120px;z-index:5;pointer-events:none}
.flask.fly{animation:fly .6s cubic-bezier(.3,.1,.6,1) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(90px,-110px) rotate(200deg)}100%{transform:translate(184px,-62px) rotate(360deg)}}
.flask.wob{animation:wob .5s ease-in-out}
@keyframes wob{0%,100%{transform:translate(184px,-62px) rotate(0)}30%{transform:translate(184px,-62px) rotate(-22deg)}70%{transform:translate(184px,-62px) rotate(22deg)}}
.flask.rest{transform:translate(184px,-62px)}
.mon.suck{transform:scale(.05);opacity:0}
.mon.hit{animation:hit .45s}
.mon.lunge{animation:lunge .45s}
.mon.lunge2{animation:lunge2 .45s}
.mon.faint{transform:translateY(60px);opacity:0;transition:transform .6s,opacity .6s}
.mon.enter{animation:enter .5s}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(-8px);filter:brightness(1.8)}50%{transform:translateX(7px)}}
@keyframes lunge{40%{transform:translate(40px,-24px)}}
@keyframes lunge2{40%{transform:translate(-40px,26px)}}
@keyframes enter{from{transform:translateX(120px);opacity:0}}
.dmg{position:absolute;font-family:var(--display);font-size:26px;color:#fff;-webkit-text-stroke:2px var(--ink);right:70px;top:40px;animation:pop .9s forwards;pointer-events:none;z-index:6}
.dmg.big{color:var(--sun);font-size:30px}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
.log{margin-top:8px;min-height:48px;padding:6px 12px;font-weight:800;font-size:14px;line-height:1.5;border:3px solid var(--ink);border-radius:12px;background:var(--panel)}
.qpanel{margin-top:12px;padding:14px}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.qtext{font-size:18px;font-weight:800;margin:4px 0 0;line-height:1.5}
.qnote{margin-top:8px;background:#eef6ff;border:2px solid var(--t-mizu);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.5}
.qnote-h{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--t-mizu);border-radius:999px;padding:0 8px;line-height:18px;margin-bottom:4px}
.qnote p{margin:0}
.qtbl{overflow-x:auto;margin-top:6px}
.qgraph{margin-top:6px;max-width:360px}
.qgraph svg{display:block;width:100%;height:auto}
.qtbl table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;background:#fff}
.qtbl th,.qtbl td{border:1.5px solid var(--ink);padding:2px 4px;font-size:12px;text-align:center;white-space:nowrap}
.qtbl th{background:#dbeafe;font-weight:800}
.hint{font-size:13px;color:var(--accent);font-weight:800}
.choices{display:grid;gap:9px;margin-top:12px}
.choice{width:100%;text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--soft);padding:10px 12px;font-size:16px;font-weight:500;display:flex;gap:10px;align-items:center}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:800}
.choice.sel{background:#fff4d6;border-width:3px}
.choice.ok{background:#dcf5e8;border-color:var(--good)}
.choice.ok .k{background:var(--good)}
.choice.ng{background:#ffe1e5;border-color:var(--bad)}
.choice.ng .k{background:var(--bad)}
.choice:disabled{cursor:default}
.subrow{display:flex;gap:8px;margin-top:12px}
.subrow button{flex:1;border:2px solid var(--ink);border-radius:10px;background:var(--panel);padding:6px 8px;font-size:13px;font-weight:800;line-height:1.35}
.subrow button:disabled{opacity:.4}
.subrow small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.swap{display:flex;gap:8px;margin-top:8px}
.swap button{flex:1;border:2px solid var(--ink);border-radius:10px;background:var(--soft);padding:4px;font-size:12px;font-weight:800}
.swap button .mon{width:44px;height:44px;margin:0 auto}
.swap button.cur{background:#fff4d6}
.fb{margin-top:12px;border-radius:12px;padding:10px 12px;border:3px solid}
.fb.ok{border-color:var(--good);background:#effaf4}
.fb.ng{border-color:var(--bad);background:#fff1f3}
.fb h3{font-size:19px}
.fb.ok h3{color:var(--good)}.fb.ng h3{color:var(--bad)}
.fb p{margin:4px 0 0;font-size:15px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.acts .btn{font-size:16px;padding:10px 6px}
.acts small{display:block;font-family:var(--body);font-weight:800;font-size:11px}

/* party / dex */
.sec-h{font-size:22px;margin:6px 0 12px}
.leadcard{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:14px;align-items:center}
.leadcard .mon{width:120px;height:120px}
.leadcard h3{font-size:22px}
.mini{font-size:12px;color:var(--muted);font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcard{padding:8px 6px;text-align:center;border-width:2px;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.mcard .mon{width:72px;height:72px}
.mcard b{font-size:13px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.mcard .no{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:800}
.mcard.inparty{background:#fff4d6}
.mcard.unseen{background:var(--soft);color:var(--muted)}
.mcard.unseen .mon{display:grid;place-items:center;font-family:var(--display);font-size:30px;color:#c5d0dc}
.detail{margin-top:14px;padding:14px}
.detail .row{display:flex;gap:12px;align-items:center}
.detail .mon{flex:none;width:90px;height:90px}
.detail p{margin:6px 0 0;font-size:14px}
.detail .btns{display:flex;gap:8px;margin-top:12px}
.detail .btns .btn{font-size:14px;padding:8px}
.typechart{display:flex;gap:14px;align-items:center;padding:12px 14px;margin-top:16px}
.typechart svg{flex:none;width:130px;height:130px}
.typechart p{margin:0;font-size:13px}
.dexcount{font-weight:800;color:var(--muted);font-size:13px;margin:-6px 0 12px}

/* map */
.qmap{margin-top:6px;background:#fff;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.qmap svg,.mapcard svg{display:block;width:100%;height:auto;max-height:60vh}
.qmap.big{margin-top:12px}
.jmap path.tp{cursor:pointer}
.mon svg.jmap,svg.jmap{overflow:hidden}
.mapcredit{font-size:9.5px;color:var(--muted);padding:2px 6px;background:#fff}
.mapcard{padding:6px;overflow:hidden}
.rarecard{border-color:#d9a400;box-shadow:0 4px 0 #d9a400;background:linear-gradient(135deg,#fff4d6,#ffe9a8)}
.rarecell{background:#fff8e1}
.mcard.unseen .mon svg{opacity:.5}
.bkcard{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;margin-top:22px;padding:10px 14px;background:var(--soft)}
.bkcard b{font-family:var(--display);font-weight:400;font-size:16px}
.bkcard span{font-size:12px;color:var(--muted);font-weight:800}
.bkcard.warn{background:#fff4d6;border-color:#d9a400;box-shadow:0 4px 0 #d9a400}
.bkta{width:100%;height:84px;border:2px solid var(--ink);border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;resize:vertical;background:#fff;color:var(--ink)}
.bkmsg{font-weight:800;color:var(--good);margin:12px 0 0}
.maplegend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:800}
.maplegend span{display:flex;align-items:center;gap:3px}
.maplegend i{display:inline-block;width:18px;height:12px;border:1.5px solid var(--ink);border-radius:3px}
/* evolution */
.evotag{font-size:10px;font-weight:800;color:#fff;background:var(--accent);border-radius:999px;padding:0 8px;line-height:18px}
.evobtn{margin-top:12px}
.evo-stage{margin-top:8px;border:3px solid var(--ink);border-radius:20px;background:radial-gradient(circle at 50% 45%,#3b4a7a 0,#1c2440 70%);color:#fff;text-align:center;padding:22px 16px 18px;overflow:hidden}
.evo-msg{font-size:17px;font-weight:800;min-height:56px;margin:0}
.evo-box{position:relative;width:220px;height:220px;margin:6px auto 10px;max-width:100%}
.evo-box .mon{position:absolute;inset:0}
.evo-glow{position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle,#fff6c9 0,rgba(255,246,201,0) 70%);opacity:0;transform:scale(.5)}
.evo-b{opacity:0}
.run .evo-a,.run .evo-b{filter:brightness(0) invert(1)}
.run .evo-a{animation:evoA 3.3s linear forwards}
.run .evo-b{animation:evoB 3.3s linear forwards}
.run .evo-glow{animation:glow 3.3s ease-in forwards}

.spark{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;background:var(--sun);border-radius:2px;transform:rotate(45deg);opacity:0}

.evo-btns{display:flex;flex-direction:column;gap:10px;min-height:52px}

.get.evo{background:#fff4d6}
.result .btn{margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function shade(hex,a){
  const n=parseInt(hex.slice(1),16), c=[n>>16,(n>>8)&255,n&255];
  return "#"+c.map(v=>Math.round(a<0?v*(1+a):v+(255-v)*a)).map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("");
}

}

const MAPK=19.7, MAPLON0=123.63, MAPY0=1008.9;
function mapProj(lon,lat){ const m=180/Math.PI*Math.log(Math.tan(Math.PI/4+lat*Math.PI/360)); return [MAPK*(lon-MAPLON0), MAPY0-MAPK*m]; }
const MAP_ALL_MAIN = Object.keys(MAPD).filter(k=>k!=="okinawa");
function mapBox(view){
  if(!view) return [0,0,438,516];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const id of view){ const [x,y,w,h]=MAPB[id]; x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x+w); y1=Math.max(y1,y+h); }
  const pad=Math.max(x1-x0,y1-y0)*.06;
  return [x0-pad,y0-pad,x1-x0+pad*2,y1-y0+pad*2];
}
/* o: {view:[id...], fill:{id:color}, sel:id, tap:bool, pts:[[label,lon,lat]], names:bool} */
function mapSVG(o={}){
  const vb=mapBox(o.view), sw=(vb[2]/300).toFixed(2), showOki=!o.view||o.view.includes("okinawa");
  let s=`<svg class="jmap" viewBox="${vb.map(v=>v.toFixed(1)).join(" ")}" role="img" aria-label="日本地図">`;
  s+=`<rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="#cfe9fb"/>`;
  if(showOki && !o.view) s+=`<rect x="0" y="418" width="130" height="98" fill="none" stroke="#24324a" stroke-width="${sw}" stroke-dasharray="3 2"/>`;
  for(const [id,[nm,d]] of Object.entries(MAPD)){
    if(id==="okinawa" && !showOki) continue;
    const f=(o.fill&&o.fill[id])||(o.sel===id?"#ffcf3a":"#f6f2e3");
    s+=`<path d="${d}" data-p="${id}" fill="${f}" stroke="#24324a" stroke-width="${sw}" stroke-linejoin="round"${o.tap?' class="tp"':''}><title>${o.names?nm:''}</title></path>`;
  }
  if(o.pts){ const r=vb[2]/55, fs=vb[2]/22;
    for(const [lab,lon,lat] of o.pts){ const [x,y]=mapProj(lon,lat);
      s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#e8475a" stroke="#fff" stroke-width="${r/3}"/>`;
      s+=`<text x="${x+r*1.6}" y="${y+fs*.35}" font-size="${fs}" font-weight="800" fill="#24324a" stroke="#fff" stroke-width="${fs/5}" paint-order="stroke">${lab}</text>`; } }

}

  if(got.length) persist();

}

const BK_PREFIX="RQ1-";
function backupCode(){ return BK_PREFIX+btoa(unescape(encodeURIComponent(JSON.stringify(save)))); }
function parseBackup(t){
  t=(t||"").replace(/\s+/g,""); if(!t.startsWith(BK_PREFIX)) return null;
  try{ const o=JSON.parse(decodeURIComponent(escape(atob(t.slice(BK_PREFIX.length)))));
    if(o && o.v===2 && o.owned && typeof o.owned==="object" && Array.isArray(o.party)) return o; }catch(e){}
  return null;
}
let bkMsg="", bkPending=null;
function showBackup(){
  showTabs(true); window.scrollTo(0,0);
  const code=backupCode(), n=Object.keys(save.owned).length;
  app.innerHTML=`<h2 class="sec-h">きろくのバックアップ</h2>

    ${bkPending?`<div class="confirm" style="margin-top:8px;flex-wrap:wrap">なかま ${Object.keys(bkPending.owned).length}ひきのきろくにおきかえるよ。いまのきろくはきえるけど、いい？ <button id="bkyes">おきかえる</button><button id="bkno">やめる</button></div>`:''}
  </div>
  ${bkMsg?`<p class="bkmsg">${bkMsg}</p>`:''}
  <button class="btn alt" id="bkback" style="margin-top:14px">ぼうけんにもどる</button>`;
  const g=id=>document.getElementById(id);
  g("bkcopy").onclick=()=>{
    const done=()=>{ save.lastBackup=Date.now(); persist(); bkMsg="コピーしたよ！ メモアプリなどにはりつけて保存してね。"; showBackup(); };
    try{ navigator.clipboard.writeText(code).then(done, ()=>{ const t=g("bkout"); t.focus(); t.select(); bkMsg="コピーできなかったので、文字を全部えらんだよ。長おしして「コピー」してね。"; save.lastBackup=Date.now(); persist(); const m=document.querySelector(".bkmsg"); if(m) m.textContent=bkMsg; else showBackup(); }); }
    catch(e){ const t=g("bkout"); t.focus(); t.select(); }
  };
  g("bkout").onfocus=e=>e.target.select();
  g("bkload").onclick=()=>{ const o=parseBackup(g("bkin").value); if(!o){ bkPending=null; bkMsg="コードが読みとれなかったよ。さいしょの「RQ1-」から最後まで、全部はりつけてね。"; } else { bkPending=o; bkMsg=""; } showBackup(); };
  if(bkPending){ g("bkyes").onclick=()=>{ save=bkPending; bkPending=null; for(const [id,o] of Object.entries(save.owned)) if(o.form==null && SP[id]) o.form=formIdx(id,o.lv); persist(); bkMsg="きろくをもどしたよ！"; showBackup(); };

    ${canEvo(d)?`<button class="btn go evobtn" id="evo">${esc(nameOf(d))}をしんかさせる！</button>`:(SP[d].forms[curF(d)+1]?`<p class="mini">Lv.${SP[d].forms[curF(d)+1].lv}になると、しんかできる</p>`:'')}
    <div class="btns">${save.party[0]!==d?`<button class="btn go" id="mklead">せんとうにする</button>`:''}${inP?(save.party.length>1?`<button class="btn alt" id="rm">パーティからはずす</button>`:''):`<button class="btn alt" id="add" ${save.party.length>=3?'disabled':''}>${save.party.length>=3?'パーティがいっぱい':'パーティに入れる'}</button>`}</div></div>
  <div class="card typechart">${typeChartSVG()}<p><b>タイプのあいしょう</b><br>やじるしの先のタイプに「こうかばつぐん」（2倍）。ぎゃくむきだと半分になるよ。あいてに合わせて、なかまをこうたいしよう。</p></div>`;
  app.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>{ partySel=b.dataset.id; showParty(); });
  const g=id=>document.getElementById(id);
  if(g("evo")) g("evo").onclick=()=>showEvolve(d);
  if(g("mklead")) g("mklead").onclick=()=>{ save.party=[d,...save.party.filter(x=>x!==d)].slice(0,3); persist(); showParty(); };
  if(g("rm")) g("rm").onclick=()=>{ save.party=save.party.filter(x=>x!==d); persist(); showParty(); };
  if(g("add")) g("add").onclick=()=>{ if(save.party.length<3){ save.party.push(d); persist(); showParty(); } };
}
function typeChartSVG(){
  const P = {mizu:[65,14], hono:[116,65], kusa:[65,116], iwa:[14,65]}, col={mizu:"#3d8bff",hono:"#ff6a2b",kusa:"#34a853",iwa:"#a0784b"};
  let s = `<svg viewBox="0 0 130 130"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#24324a"/></marker></defs>`;
  for(const [a,b] of Object.entries(BEATS)){ const [x1,y1]=P[a],[x2,y2]=P[b]; const k=.3; s+=`<line x1="${x1+(x2-x1)*k}" y1="${y1+(y2-y1)*k}" x2="${x2-(x2-x1)*k}" y2="${y2-(y2-y1)*k}" stroke="#24324a" stroke-width="3" marker-end="url(#ar)"/>`; }
  for(const [t,[x,y]] of Object.entries(P)) s+=`<circle cx="${x}" cy="${y}" r="13" fill="${col[t]}" stroke="#24324a" stroke-width="2.5"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${TYPES[t][0]}</text>`;
  return s+`</svg>`;
}

/* ---------- battle ---------- */
let B = null;
function startBattle(uid, sid){
  showTabs(false);
  const u = UNITS.find(x=>x.id===uid);
  let queue, pool, name, lvBase, sIdx = u.stages.findIndex(x=>x.id===sid);
  if(sid==="boss"){
    const all=[]; u.stages.forEach(s=>s.qs.forEach((q,i)=>all.push({q,key:qKey(u.id,s.id,i)})));
    queue = shuffle(all).slice(0,10); pool=[u.legend]; name="でんせつのすみか"; lvBase=14;
  }else if(sid==="review"){
    queue=[]; u.stages.forEach(s=>s.qs.forEach((q,i)=>{const k=qKey(u.id,s.id,i); if(save.wrong[k]) queue.push({q,key:k});}));
    pool = Object.keys(u.monsters).filter(k=>k!==u.legend); name="ニガテの森"; lvBase=4;
  }else{
    const s=u.stages[sIdx];
    queue = s.qs.map((q,i)=>({q,key:qKey(u.id,s.id,i)})); pool=s.wild; name=s.name; lvBase=2+sIdx*2;
  }
  const colBefore = prefLevels();
  B = {colBefore, u, sid, name, queue, total:queue.length, pool, lvBase, hearts:MAX_HP, lead:save.party[0],
       wild:null, combo:0, maxCombo:0, mistakes:0, n:0, used:{}, power:false, luck:false,
       caught:[], defeated:0, evoReady:[], lvups:{}, ballsGot:0, busy:false, swapOpen:false};
  spawn(); renderBattle(true);
}
function spawn(){
  const id = pick(B.pool), boss = B.sid==="boss";
  const lv = boss ? B.lvBase : B.lvBase + Math.floor(Math.random()*2);
  const max = boss ? 150 : 28 + lv*3;
  B.wild = {id, lv, hp:max, max};
  save.seen[id]=1; persist();
}
function addExp(id, n){
  const o = save.owned[id]; if(!o) return;
  const could = canEvo(id), lv0 = o.lv;
  o.exp += n;
  while(o.lv<30 && o.exp>=need(o.lv)){ o.exp-=need(o.lv); o.lv++; }
  if(B && o.lv>lv0) B.lvups[id]=o.lv;
  if(B && !could && canEvo(id) && !B.evoReady.includes(id)) B.evoReady.push(id);
  persist();
}
function dmgOf(){
  const me = B.lead, lv = save.owned[me].lv, m = mult(SP[me].type, SP[B.wild.id].type);
  return {m, d: Math.max(2, Math.round(8*m*(1+lv*0.1)*(B.power?2:1)))};
}
function fieldHTML(enter){
  const w=B.wild, me=B.lead, o=save.owned[me], r=w.hp/w.max, ws=SP[w.id];
  return `<div class="field" id="field"><div class="plat w"></div><div class="plat m"></div>
    <div class="info w"><div class="nm">${esc(nameOf(w.id,w.lv))} ${typeChip(ws.type)}<span class="lv">Lv.${w.lv}</span></div><div class="bar hpbar ${hpClass(r)}" id="whp"><i style="width:${r*100}%"></i></div></div>
    <div class="mon ${enter?'enter':''}" id="wildMon">${art(w.id,w.lv)}</div>
    <div class="mon" id="meMon">${artMine(me)}</div>
    <div class="info m"><div class="nm">${esc(nameOf(me))} ${typeChip(SP[me].type)}<span class="lv">Lv.${o.lv}</span></div><div class="bar expbar"><i style="width:${o.exp/need(o.lv)*100}%"></i></div></div>
  </div>`;
}
let logMsg = "";
function renderBattle(enter){
  const item = B.queue[0], q = item.q, multi = q.type==="multi", isOrd = q.type==="order", isMat = q.type==="match", isPref = q.type==="pref";

  item.hidden = item.hidden || [];

  <div class="btop"><button class="back" id="back">← にげる</button><span class="pill">${flaskSVG} ×${save.balls}</span><div class="hearts">${Array.from({length:MAX_HP},(_,i)=>heart(i<B.hearts)).join("")}</div></div>

    <p class="qtext">${esc(q.q)}</p>${multi?'<div class="hint">2つえらんで「けってい」</div>':''}${isOrd?'<div class="hint">はじめのものから順にタップしよう</div>':''}${isMat?'<div class="hint">左をタップしてから、右をタップしてつなごう</div>':''}${isPref?'<div class="hint">地図をタップしてえらび、「けってい」</div>':''}
    ${isPref?`<div class="qmap big">${mapSVG({view:q.view, sel:item.selP, tap:true})}${MAPCREDIT}</div><button class="btn" id="dec" style="margin-top:10px" ${item.selP?'':'disabled'}>けってい</button>`:isOrd?orderHTML(item,q):isMat?matchHTML(item,q):`<div class="choices">${item.order.filter(ci=>!item.hidden.includes(ci)).map((ci,k)=>`<button class="choice" data-i="${ci}">${q.c[ci]===KANA[k]?'':`<span class="k">${KANA[k]}</span>`}<span>${esc(q.c[ci])}</span></button>`).join("")}</div>`}
    ${multi?'<button class="btn" id="dec" style="margin-top:12px" disabled>けってい</button>':''}
    ${isOrd||isMat?`<div class="ordrow"><button class="btn alt" id="redo">やりなおし</button><button class="btn" id="dec" ${(isOrd?item.seq.length===q.c.length:Object.keys(item.pairs).length===q.pairs.length)?'':'disabled'}>けってい</button></div>`:''}
    <div id="sub"><div class="subrow"><button id="skill" ${B.used[me]?'disabled':''}>${sk.n}${B.used[me]?'（使った）':''}<small>${sk.d}</small></button><button id="swapBtn" ${save.party.length<2?'disabled':''}>こうたい<small>${save.party.length<2?'なかまをふやそう':'なかまを入れかえる'}</small></button></div>
    ${B.swapOpen?`<div class="swap">${save.party.map(id=>`<button class="${id===me?'cur':''}" data-id="${id}"><div class="mon">${artMine(id)}</div>${esc(nameOf(id))}</button>`).join("")}</div>`:''}</div>
    <div id="fb"></div>
  </div>`;
  document.getElementById("back").onclick=()=>{ B=null; home(); };
  let sel=[];
  app.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{
    if(B.busy) return; const i=+btn.dataset.i;
    if(!multi) return judge([i]);
    if(sel.includes(i)){ sel=sel.filter(x=>x!==i); btn.classList.remove("sel"); }
    else if(sel.length<2){ sel.push(i); btn.classList.add("sel"); }
    document.getElementById("dec").disabled = sel.length!==2;
  });
  if(multi) document.getElementById("dec").onclick=()=>judge(sel);
  if(isOrd){
    app.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{ if(B.busy) return; const i=+btn.dataset.i; if(item.seq.includes(i)) return; item.seq.push(i); renderBattle(); });
    document.getElementById("redo").onclick=()=>{ if(B.busy) return; item.seq=[]; renderBattle(); };
    document.getElementById("dec").onclick=()=>judge(item.seq);
  }
  if(isPref){
    app.querySelectorAll(".qmap path.tp").forEach(p=>p.onclick=()=>{ if(B.busy) return;

    app.querySelectorAll(".mbtn.R").forEach(b=>b.onclick=()=>{ if(B.busy||item.selL==null) return; const r=+b.dataset.r;
      for(const k of Object.keys(item.pairs)) if(item.pairs[k]===r) delete item.pairs[k];
      item.pairs[item.selL]=r; item.selL=null; renderBattle(); });
    document.getElementById("redo").onclick=()=>{ if(B.busy) return; item.pairs={}; item.selL=null; renderBattle(); };

  app.querySelectorAll(".swap button").forEach(b=>b.onclick=()=>{

    const m=mult(SP[B.lead].type,SP[B.wild.id].type);
    logMsg=`いけっ！ <b>${esc(nameOf(B.lead))}</b>！`+(m===2?' あいしょうはばつぐん！':m===.5?' あいしょうが悪いかも…':'');
    renderBattle();
  });
}
const PCOL=["#3d8bff","#ff7a2f","#24a865","#b06ad9","#e8475a","#a0784b"];
function orderHTML(item,q){
  return `<div class="choices">${item.order.map(ci=>{ const n=item.seq.indexOf(ci);
    return `<button class="choice ${n>=0?'sel':''}" data-i="${ci}"><span class="k" ${n<0?'style="background:#dfe6ee"':''}>${n>=0?n+1:''}</span><span>${esc(q.c[ci])}</span></button>`; }).join("")}</div>`;
}
function matchHTML(item,q){
  const P=item.pairs, inv={}; for(const [l,r] of Object.entries(P)) inv[r]=+l;
  const badge=l=>l==null?'<span class="k" style="background:#dfe6ee"></span>':`<span class="k" style="background:${PCOL[l%PCOL.length]}">${l+1}</span>`;
  return `<div class="match"><div class="mcol">${q.pairs.map((p,i)=>`<button class="mbtn L ${item.selL===i?'cur':''}" data-l="${i}">${badge(P[i]!=null?i:null)}<span>${esc(p[0])}</span></button>`).join("")}</div>
    <div class="mcol">${item.ro.map(r=>`<button class="mbtn R ${item.selL!=null?'ready':''}" data-r="${r}">${badge(inv[r])}<span>${esc(q.pairs[r][1])}</span></button>`).join("")}</div></div>`;
}
function setLog(h){ logMsg=h; const l=document.getElementById("log"); if(l) l.innerHTML=h; }
function useSkill(){
  const me=B.lead, k=SP[me].skill, item=B.queue[0], q=item.q;
  if(B.used[me]) return;
  const nm = `<b>${esc(nameOf(me))}</b>の ${SKILLS[k].n}！ `;
  if(k==="hint" && q.type==="pref"){ setLog("この問題では、ヒントの光はつかえないよ。"); return; }
  if(k==="hint" && q.type==="order"){
    let ok=0; while(ok<item.seq.length && item.seq[ok]===ok) ok++;
    if(ok>=q.c.length-1){ setLog("もう少しでできるよ！"); return; }
    item.seq=item.seq.slice(0,ok); item.seq.push(ok); logMsg = nm+`「${esc(q.c[ok])}」の順番を教えてくれた！`;
  }
  else if(k==="hint" && q.type==="match"){
    const miss=q.pairs.map((_,i)=>i).filter(i=>item.pairs[i]!==i);
    if(miss.length<=1){ setLog("もう少しでできるよ！"); return; }
    const i=pick(miss); for(const kk of Object.keys(item.pairs)) if(item.pairs[kk]===i) delete item.pairs[kk];
    item.pairs[i]=i; logMsg = nm+`「${esc(q.pairs[i][0])}」の答えを教えてくれた！`;
  }
  else if(k==="hint"){
    const ans = Array.isArray(q.a)?q.a:[q.a];
    const cand = item.order.filter(i=>!ans.includes(i)&&!item.hidden.includes(i));
    if(cand.length<=1 && !(q.type==="multi" && cand.length)) { setLog("これ以上は消せないみたい。"); return; }
    item.hidden.push(pick(cand)); logMsg = nm+"まちがいを1つ消した！";
  }
  if(k==="heal"){ if(B.hearts>=MAX_HP){ setLog("ハートはまんたんだよ。"); return; } B.hearts++; logMsg = nm+"ハートが1つ回復した！"; }
  if(k==="power"){ B.power=true; logMsg = nm+"次のこうげきが2倍になる！"; }
  if(k==="luck"){ B.luck=true; logMsg = nm+"次のフラスコがつかまえやすくなった！"; }
  B.used[me]=true; B.swapOpen=false; renderBattle();
}
function judge(picked){
  if(B.busy) return; B.busy=true;
  const item=B.queue[0], q=item.q, ans=Array.isArray(q.a)?q.a:[q.a];
  let ok, ansText;
  if(q.type==="order"){
    ok = picked.length===q.c.length && picked.every((v,i)=>v===i); ansText = q.c.join(" → ");
    app.querySelectorAll(".choice").forEach(b=>{ b.disabled=true; const i=+b.dataset.i; b.classList.add(picked.indexOf(i)===i?"ok":"ng"); });
  }else if(q.type==="pref"){
    ok = picked[0]===q.a; ansText = MAPD[q.a][0];
    const pa=app.querySelector(`.qmap path[data-p="${q.a}"]`); if(pa) pa.setAttribute("fill","#7ed9a6");
    if(!ok && picked[0]){ const pw=app.querySelector(`.qmap path[data-p="${picked[0]}"]`); if(pw) pw.setAttribute("fill","#ff9aa8"); }
    const dd=document.getElementById("dec"); if(dd) dd.hidden=true;
  }else if(q.type==="match"){
    ok = q.pairs.every((_,i)=>picked[i]===i); ansText = q.pairs.map(p=>p[0]+"＝"+p[1]).join("、");
    app.querySelectorAll(".mbtn").forEach(b=>{ b.disabled=true; if(b.dataset.l!=null) b.classList.add(picked[+b.dataset.l]===+b.dataset.l?"ok":"ng"); });
  }else{
    ok = picked.length===ans.length && picked.every(p=>ans.includes(p)); ansText = ans.map(i=>q.c[i]).join("・");
    app.querySelectorAll(".choice").forEach(b=>{ const i=+b.dataset.i; b.disabled=true; b.classList.remove("sel"); if(ans.includes(i)) b.classList.add("ok"); else if(picked.includes(i)) b.classList.add("ng"); });
  }
  const rr=document.getElementById("redo"); if(rr) rr.parentNode.hidden=true;
  const dec=document.getElementById("dec"); if(dec) dec.hidden=true;
  document.getElementById("sub").hidden=true;
  const fb=document.getElementById("fb"); B.n++;
  if(ok){
    B.combo++; B.maxCombo=Math.max(B.maxCombo,B.combo);
    let bonus="";
    if(B.combo%3===0){ save.balls++; B.ballsGot++; bonus=`<p><b>${B.combo}コンボ！ フラスコを1つひろった！</b></p>`; }
    if(B.sid==="review") delete save.wrong[item.key];
    B.queue.shift(); persist();
    addExp(B.lead, 6); save.party.forEach(id=>{ if(id!==B.lead) addExp(id,3); });
    const {m} = dmgOf();
    fb.innerHTML = `<div class="fb ok"><h3>せいかい！</h3><p>${esc(q.e)}</p>${bonus}</div>
      <div class="acts"><button class="btn go" id="atk">こうげき<small>${m===2?'こうかばつぐん':m===.5?'いまひとつ':'ふつう'}${B.power?'・2倍':''}</small></button>
      <button class="btn alt" id="ball" ${save.balls?'':'disabled'}>フラスコ<small>${save.balls?'のこり '+save.balls+'こ':'もっていない'}</small></button></div>`;
    document.getElementById("atk").onclick=doAttack;
    document.getElementById("ball").onclick=doBall;
    setLog(`<b>${esc(nameOf(B.lead))}</b>がやる気になった！ どうする？`);
  }else{
    B.combo=0; B.hearts--; B.mistakes++;
    save.wrong[item.key]=(save.wrong[item.key]||0)+1;
    item.hidden=[]; item.seq=[]; item.pairs={}; item.selL=null; item.selP=null; B.queue.push(B.queue.shift()); persist();
    const wm=document.getElementById("wildMon"), mm=document.getElementById("meMon");
    wm.classList.add("lunge2"); setTimeout(()=>mm.classList.add("hit"),200);
    const hs=app.querySelectorAll(".hearts svg path"); if(hs[B.hearts]) hs[B.hearts].setAttribute("fill","#dfe6ee");
    setLog(`やせいの <b>${esc(nameOf(B.wild.id,B.wild.lv))}</b>のこうげき！ ハートが1つへった。`);
    fb.innerHTML = `<div class="fb ng">${ansText.length>18?`<h3>ざんねん…</h3><p><b>正解：${esc(ansText)}</b></p>`:`<h3>ざんねん… 正解は「${esc(ansText)}」</h3>`}<p>${esc(q.e)}</p><p class="mini">この問題は、あとでもう一度出てくるよ。</p></div><button class="btn" id="next" style="margin-top:12px">${B.hearts<=0?'…':'つぎへ'}</button>`;
    document.getElementById("next").onclick=()=>{ B.busy=false; if(B.hearts<=0) return finish(false); renderBattle(); };
  }
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function lockActs(){ app.querySelectorAll(".acts button").forEach(b=>b.disabled=true); document.getElementById("field").scrollIntoView({behavior:"smooth",block:"start"}); }
function doAttack(){
  lockActs();
  const {m,d}=dmgOf(); B.power=false;
  const w=B.wild, wm=document.getElementById("wildMon"), mm=document.getElementById("meMon");
  mm.classList.add("lunge");
  setTimeout(()=>{
    wm.classList.add("hit");
    const t=document.createElement("div"); t.className="dmg"+(m===2?" big":""); t.textContent=d; document.getElementById("field").appendChild(t);
    w.hp=Math.max(0,w.hp-d); const r=w.hp/w.max, bar=document.getElementById("whp");
    bar.className="bar hpbar "+hpClass(r); bar.firstElementChild.style.width=(r*100)+"%";
    let msg=`<b>${esc(nameOf(B.lead))}</b>のこうげき！ `+(m===2?'こうかはばつぐんだ！':m===.5?'こうかはいまひとつ…':'')+` ${d}ダメージ！`;
    if(w.hp<=0){ msg+=` <b>${esc(nameOf(w.id,w.lv))}</b>をたおした！`; B.defeated++; addExp(B.lead,12); save.party.forEach(id=>{ if(id!==B.lead) addExp(id,6); }); setTimeout(()=>wm.classList.add("faint"),350); }
    else if(r<=.3) msg+=` よわっている！ フラスコのチャンス！`;
    setLog(msg);
    setTimeout(after, w.hp<=0?1300:1000);
  },250);
}
function doBall(){
  lockActs();
  const w=B.wild, boss=B.sid==="boss";
  save.balls--; persist();
  const p = Math.min(.95, (boss?.08:.3) + (1-w.hp/w.max)*(boss?.55:.55) + Math.min(B.combo,5)*.04 + (B.luck?.3:0));
  B.luck=false;
  const got = Math.random()<p, shakes = got?3:Math.floor(Math.random()*3);
  const f=document.getElementById("field"), fl=document.createElement("div");
  fl.className="flask fly"; fl.innerHTML=flaskSVG; f.appendChild(fl);
  const wm=document.getElementById("wildMon");
  setLog(`いけっ、フラスコ！`);
  setTimeout(()=>{ wm.classList.add("suck"); fl.className="flask rest"; let k=0;
    const step=()=>{
      if(k<shakes){ k++; fl.className="flask rest"; void fl.offsetWidth; fl.className="flask wob"; setLog("…".repeat(k)); setTimeout(step,700); return; }
      if(got){
        const nm=nameOf(w.id,w.lv), had=!!save.owned[w.id];
        if(had){ addExp(w.id,25); setLog(`やった！ <b>${esc(nm)}</b>をつかまえた！ もうなかまにいるので、なかまの${esc(nameOf(w.id))}がパワーアップ（EXP+25）！`); }
        else{ save.owned[w.id]={lv:w.lv,exp:0,form:formIdx(w.id,w.lv)}; if(save.party.length<3) save.party.push(w.id); persist(); setLog(`やった！ <b>${esc(nm)}</b>をつかまえた！ なかまになった！`); }
        B.caught.push({id:w.id, lv:w.lv, dup:had});
        w.hp=0; w.caught=true; setTimeout(after,1500);
      }else{
        fl.remove(); wm.classList.remove("suck");
        setLog(`ああっ！ <b>${esc(nameOf(w.id,w.lv))}</b>が出てきてしまった！`+(w.hp/w.max>.3?' もっとよわらせよう。':''));
        setTimeout(after,1300);
      }
    };
    setTimeout(step,300);
  },620);
}
function after(){
  B.busy=false;
  const gone = B.wild.hp<=0;
  if(!B.queue.length) return finish(true);
  if(gone){ spawn(); renderBattle(true); } else renderBattle();
}

/* ---------- result ---------- */
function finish(win){
  window.scrollTo(0,0);
  let stars=0;
  if(win){
    stars = B.mistakes===0?3:B.mistakes<=2?2:1;
    save.balls += 3;
    if(B.sid!=="review"){ const k=B.u.id+"|"+B.sid; save.cleared[k]=Math.max(save.cleared[k]||0,stars); }
    addExp(B.lead, stars*5);
  }
  persist();
  const rares = grantRares();
  const lvAfter = prefLevels(), newCol = Object.keys(lvAfter).filter(p=>lvAfter[p]>(B.colBefore[p]||0));
  const gets = [
    ...rares.map(rareCard),
    ...(newCol.length?[`<div class="card get evo"><div class="mon" style="width:64px;height:64px">${mapSVG({view:newCol, fill:Object.fromEntries(newCol.map(p=>[p,MAPLV[lvAfter[p]]]))})}</div><div><b>地図の ${newCol.map(p=>MAPD[p][0]).join("・")} の色がこくなった！</b><span>色の段階 ${[...new Set(newCol.map(p=>lvAfter[p]))].join("・")}／4　「ちず」で見てみよう</span></div></div>`]:[]),
    ...B.evoReady.map(id=>`<div class="card get evo"><div class="mon">${artMine(id)}</div><div><b>${esc(nameOf(id))} Lv.${save.owned[id].lv}</b><span>しんかできるようになった！ 「なかま」でしんかさせよう</span></div></div>`),
    ...B.caught.map(c=>`<div class="card get"><div class="mon">${art(c.id,c.lv)}</div><div><b>${esc(nameOf(c.id,c.lv))}</b><span>${c.dup?'もういたのでパワーアップ':'あたらしいなかま！ずかんに登録'}</span></div></div>`)
  ].join("");
  const ups = Object.entries(B.lvups).filter(([id])=>!B.evoReady.includes(id)).map(([id,lv])=>`${esc(nameOf(id))} Lv.${lv}`).join("・");
  app.innerHTML = `<div class="result">
    <h2>${win?'ルートクリア！':'目の前がまっくらになった…'}</h2>
    ${win?`<div class="big">${starStr(stars)}</div><p class="line">まちがい ${B.mistakes}回・さいだい ${B.maxCombo}コンボ・たおした ${B.defeated}ひき</p><p class="line">フラスコ +${3+B.ballsGot}</p>`:`<p class="line">まちがえた問題は「ニガテの森」で練習できるよ</p>`}
    ${ups?`<p class="line">レベルアップ：${ups}</p>`:''}
    <div class="gets">${gets}</div>
    ${B.evoReady.length?`<button class="btn go" id="toEvo">しんかさせにいく！</button>`:''}
    <button class="btn ${B.evoReady.length?'':'go'}" id="again">${win?'もう一度ぼうけん':'リベンジする'}</button>
    <button class="btn alt" id="map">マップにもどる</button></div>`;
  const u=B.u.id, s=B.sid, er=B.evoReady[0];
  if(er) document.getElementById("toEvo").onclick=()=>{ B=null; tab="party"; partySel=er; home(); };
  document.getElementById("again").onclick=()=>{ if(s==="review" && !Object.keys(save.wrong).some(k=>k.startsWith(u+"|"))) return home(); startBattle(u,s); };
  document.getElementById("map").onclick=()=>{ B=null; tab="adv"; home(); };
}

home();
</script>
